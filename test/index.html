<style>
:root{--bg:#0d0f13;--panel:#1b212b;--panel2:#29313f;--line:#3b4456;--text:#f3f5f9;--mute:#9aa3b2;--lime:#c6ff3d;--lime2:#a5e400;--orange:#ff7a2f;--red:#ff4d5e;--green:#2fd27a;
--maths:#4da3ff;--further:#b27cff;--chem:#33d17a;--cs:#ff9f1c;--t0:#e5484d;--t1:#3e7bff;--t2:#e8a317;--t3:#2a9d5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#1b2230 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
a{color:var(--lime)}
.wrap{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(60px,calc(env(safe-area-inset-bottom) + 24px)) max(16px,env(safe-area-inset-left))}
/* phone rules (FNF_Phone_Games_Guide.md, 16 Nov 2026): 44 px targets, no double-tap zoom, 16 px text in boxes */
button,a[href],select,input:not([type=checkbox]){min-height:44px;min-width:44px;touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
/* typing view: while a text box has focus and an on-screen keyboard is up, the header and footer fold away and the
   box's label is scrolled to the top, so the label and the box sit together above the keyboard */
body.typing .top,body.typing .foot{display:none}
.top .row{min-width:0;flex-wrap:nowrap}.top [data-act=profile]{display:block;max-width:36vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:30px}   /* 320 px: the nickname shortens rather than pushing the page sideways */
body.typing .wrap{padding-bottom:var(--fullh,100vh)}
label,textarea,input{scroll-margin-top:8px}   /* room below, so a box near the end can still be scrolled up to the top */
#dbg{position:fixed;right:max(6px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));z-index:999;background:rgba(0,0,0,.82);color:#9f9;font:12px/1.35 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:8px;pointer-events:none;white-space:pre}
#sai{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
.wide .wrap{max-width:1100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font-weight:900;letter-spacing:.06em;font-size:calc(26px*var(--fs,1));line-height:1;display:flex;align-items:center;gap:8px}
.logo b{color:var(--lime)}
.logo small{display:block;font-size:calc(11px*var(--fs,1));letter-spacing:.12em;color:var(--mute);font-weight:700;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:calc(14px*var(--fs,1));font-weight:600}
.chip.on{background:var(--lime);color:#111;border-color:var(--lime)}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:calc(18px*var(--fs,1))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h2,.card h3{margin:0 0 8px}
h1{font-size:calc(26px*var(--fs,1));margin:6px 0 4px;font-weight:900;letter-spacing:.01em}
h2{font-size:calc(20px*var(--fs,1));font-weight:800}
h3{font-size:calc(16px*var(--fs,1));font-weight:800}
.muted{color:var(--mute)}
.small{font-size:calc(13px*var(--fs,1))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;width:auto;min-width:0}
.row>.tick+div{flex:1;min-width:0}
.top>.row{flex-wrap:nowrap}
.top .chip{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .08s,border-color .15s}
@media (hover:hover){.big:hover{border-color:#3a4252}}.big:active{transform:scale(.985)}
.big .em{font-size:calc(30px*var(--fs,1));width:46px;height:46px;display:grid;place-items:center;background:rgba(198,255,61,.10);border:1px solid rgba(198,255,61,.28);border-radius:14px;flex:none}
.big b{display:block;font-size:calc(17px*var(--fs,1))}.big span{color:var(--mute);font-size:calc(13px*var(--fs,1))}
.big.hero{background:linear-gradient(135deg,#2c3a0e,#1b212b 70%);border-color:#56721b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.btn.go{background:var(--lime);color:#111;border-color:var(--lime)}
@media (hover:hover){.btn.go:hover{background:var(--lime2)}}
.btn.warn{background:#3a1d22;border-color:#6b2a33;color:#ffb3bb}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.rank{display:flex;gap:14px;align-items:center}
.rank .badge{font-size:calc(34px*var(--fs,1));width:58px;height:58px;border-radius:18px;background:var(--panel2);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime2),var(--lime));border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:calc(20px*var(--fs,1))}.stat span{font-size:calc(12px*var(--fs,1));color:var(--mute)}
.subj{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--fs,1));font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.subj i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lv{font-size:calc(12px*var(--fs,1));font-weight:800;padding:4px 9px;border-radius:999px;background:#2a2f18;color:var(--lime);border:1px solid #46521a}
.lv.l3{background:#3a1f12;color:#ffb184;border-color:#6b3518}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.qtext{font-size:calc(19px*var(--fs,1));line-height:1.45;font-weight:600}
.wide .qtext{font-size:calc(28px*var(--fs,1))}
pre.code{background:#0a0c10;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;margin:12px 0 0;overflow-x:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;counter-reset:ln}
.wide pre.code{font-size:calc(20px*var(--fs,1))}
pre.code span{display:block;padding-left:44px;position:relative;white-space:pre}
pre.code span::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:32px;text-align:right;color:#5b6475}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;padding:12px 14px;border-radius:14px;font-size:calc(17px*var(--fs,1));font-weight:650;color:#fff;border:2px solid transparent;transition:transform .08s,opacity .2s}
.wide .opt{font-size:calc(24px*var(--fs,1));min-height:90px}
.opt:active{transform:scale(.98)}
.opt .sh{font-size:calc(20px*var(--fs,1));opacity:.9;flex:none;width:22px;text-align:center}
.opt.o0{background:var(--t0)}.opt.o1{background:var(--t1)}.opt.o2{background:var(--t2)}.opt.o3{background:var(--t3)}
.opt.dim{opacity:.28}.opt.dim.mine{opacity:.78}
.opt.right{outline:4px solid var(--lime);outline-offset:2px;opacity:1}
.opt.mine{border-color:#fff}
.opt .mark{margin-left:auto;font-size:calc(22px*var(--fs,1))}
.opt .katex{color:#fff}
.feedback{margin-top:12px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:calc(16px*var(--fs,1));line-height:1.45}
.feedback.ok{border-color:#2f6b24;background:#15230f}
.feedback.no{border-color:#6b2a33;background:#24121a}
.feedback b{font-size:calc(18px*var(--fs,1))}
.timer{position:sticky;top:max(4px,env(safe-area-inset-top));z-index:6;height:24px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:6px 0 8px}
.timer i{display:block;height:100%;background:var(--lime);width:100%;transition:width .2s linear}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(14px*var(--fs,1));font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}*{animation:none!important;transition:none!important}.opt:active,.big:active,.btn:active{transform:none!important}}
.timer.low i{background:var(--red)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.combo{font-weight:900;color:var(--orange)}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.topic .nm{flex:1;min-width:0}
.topic .nm b{display:block;font-size:calc(14px*var(--fs,1));font-weight:700}
.topic .nm span{font-size:calc(12px*var(--fs,1));color:var(--mute)}
.mini{width:80px;height:8px;border-radius:99px;background:#0f1218;overflow:hidden;flex:none}
.mini i{display:block;height:100%}
.tick{width:44px;height:44px;margin:-9px;position:relative;isolation:isolate;display:grid;place-items:center;flex:none;font-size:calc(15px*var(--fs,1));font-weight:900}
.tick::before{content:"";position:absolute;inset:9px;border-radius:8px;border:2px solid #485164;z-index:-1}
.tick.on{color:#111}.tick.on::before{background:var(--lime);border-color:var(--lime)}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
summary{padding:14px 16px;cursor:pointer;font-weight:800;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}summary{min-height:44px;touch-action:manipulation}summary::before{content:"▸";color:var(--mute)}details[open]>summary::before{content:"▾"}
details .inner{padding:0 12px 12px}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.brow.me{border-color:var(--lime)}
.brow .pos{width:26px;text-align:center;font-weight:900;color:var(--mute)}
.brow .av{font-size:calc(22px*var(--fs,1))}
.brow .pts{margin-left:auto;font-variant-numeric:tabular-nums}
.wide .brow{font-size:calc(22px*var(--fs,1));padding:14px 18px}
.code-big{font-size:calc(56px*var(--fs,1));font-weight:900;letter-spacing:.18em;color:var(--lime);font-variant-numeric:tabular-nums}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.av-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-size:calc(22px*var(--fs,1))}
.av-btn.sel{border-color:var(--lime)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#20262f;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}
.pop{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%);font-size:calc(44px*var(--fs,1));font-weight:900;color:var(--lime);text-shadow:0 4px 24px #000;pointer-events:none;animation:pop 1s ease-out forwards;z-index:40}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.big-num{font-size:calc(44px*var(--fs,1));font-weight:900;color:var(--lime);line-height:1}
.grid-emoji{font-size:calc(22px*var(--fs,1));letter-spacing:1px;white-space:nowrap}
.tag{font-size:calc(11px*var(--fs,1));font-weight:800;padding:2px 7px;border-radius:6px;background:#262c37;color:var(--mute)}
.tex-raw{font-family:ui-monospace,Menlo,monospace;font-size:.9em;opacity:.9}
.katex{font-size:1.08em}
.err{color:#ffb3bb}
.qr{background:#fff;padding:10px;border-radius:14px;display:inline-block}
.qr img,.qr canvas{display:block}
.hostq .qtext{font-size:calc(30px*var(--fs,1))}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.counts div{border-radius:10px;padding:8px;text-align:center;font-weight:900;color:#fff}
.hr{height:1px;background:var(--line);margin:14px 0}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:calc(12px*var(--fs,1));white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.center{text-align:center}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--green)}
.status-dot.off{background:var(--red)}
.linkb{text-decoration:underline;color:var(--mute);font-size:calc(13px*var(--fs,1));padding:2px 0}
.keycard{margin-top:10px;padding:12px 14px;border-radius:14px;background:#161d10;border:1px solid #3f5414;font-size:calc(15px*var(--fs,1));line-height:1.45}
.cswitch{display:flex;gap:0;margin:0 0 14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.cswitch button{flex:1;padding:12px 8px;font-size:calc(17px*var(--fs,1));font-weight:800;color:var(--mute);background:transparent;border:0}
.cswitch button.on{background:var(--lime);color:#111;opacity:1}
.cname{font-size:calc(12px*var(--fs,1));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin-top:2px}
.foot{margin-top:28px;color:var(--mute);font-size:calc(12px*var(--fs,1));text-align:center;line-height:1.6}
.topic:has(>.desc){flex-wrap:wrap}
.topic>.desc{flex-basis:100%;font-size:calc(13px*var(--fs,1));color:#c9d1dc;line-height:1.4;margin:-4px 0 0;padding-left:42px}

@font-face{font-family:"RM Lexend";src:url(../lib/fonts/rm-lexend.woff2) format("woff2");font-weight:100 900;font-display:swap}

@font-face{font-family:"RM OpenDyslexic";src:url(../lib/fonts/rm-opendyslexic-bold.woff2) format("woff2");font-weight:700 900;font-display:swap}
body.f-lexend{font-family:"RM Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.feedback[data-act]{cursor:pointer}
.tapon{display:block;margin-top:8px;font-size:calc(13px*var(--fs,1));color:var(--mute)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:360px;width:100%}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.ic{width:26px;height:26px;fill:none;stroke:var(--lime);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.logo .lg .ic{width:28px;height:28px}
.btn{background:var(--panel2);border-color:var(--line)}
a.big{color:inherit;text-decoration:none}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badges .chip{font-size:calc(12px*var(--fs,1));padding:4px 10px;min-height:32px}
.why{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
.mpill{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--lime);color:#111;font-size:calc(11px*var(--fs,1));font-weight:800;vertical-align:2px}
.tipcard{border-color:rgba(198,255,61,.35)}
/* v1.9 progress map */
.mz0{fill:#323b4b}.mz1{fill:#e8a317}.mz2{fill:var(--lime)}.mzx{fill:#1e232c}.mzd{fill:#ff7a2f}
.mzl{stroke:var(--line);stroke-width:1}.mzt{fill:#d6dbe4;font-size:11px;font-family:inherit}.mzt2{font-size:13px}
.mzn{fill:var(--panel2);stroke:var(--line)}.mzb{font-weight:800;fill:var(--text)}
.mzc{fill:var(--bg);stroke:var(--panel2)}.mzc2{fill:var(--panel);stroke:var(--lime);stroke-width:2}
.mzp{fill:var(--lime);font-weight:800;font-family:inherit}.mzh{fill:var(--text);font-size:13px;font-weight:700;font-family:inherit}
.msp0{stroke:var(--line);stroke-width:2.5}.msp1{stroke:#e8a317;stroke-width:2.5}.msp2{stroke:var(--lime);stroke-width:4}.msp-1{stroke:#2a303b;stroke-width:2;stroke-dasharray:4 4}
.mn0{fill:var(--panel);stroke:var(--line);stroke-width:2}.mnx{fill:#12151b;stroke:#2a303b;stroke-width:2;stroke-dasharray:3 3}
.mn1{fill:#2a2412;stroke:#4a3d18;stroke-width:5}.marc{fill:none;stroke:#e8a317;stroke-width:5}

/* data/<profile>/spec.js calls RM.setSpec, data/<profile>/generators.js calls RM.gen; the questions are in data/<profile>/*.jsonl */
window.RM={banks:{},spec:null,gens:[],profile:null,quiz:null,add(s,qs){(this.banks[s]=this.banks[s]||[]).push(...qs);},setSpec(x){this.spec=x;},gen(g){this.gens.push(g);}};

<script>
/* Which course: ?p=alevel or ?p=gcse in the address (and remembered), else the one chosen before on this device.
   A quiz-night join link opens the host's course (#join-ABCD is A-level, #join-ABCD-gcse is GCSE) without changing the saved choice. No course yet:
   nothing is loaded and the start screen asks. bundle.py replaces this block with the data inlined. */
(function(){
  var OK=["alevel","gcse"],m=location.search.match(/[?&]p=(alevel|gcse)(?![A-Za-z])/),p=m?m[1]:null;
  if(p){try{localStorage.setItem("rmt_profile",JSON.stringify(p));}catch(e){}}
  else{try{p=JSON.parse(localStorage.getItem("rmt_profile"));}catch(e){p=null;}}
  if(OK.indexOf(p)<0)p=null;
  var j=location.hash.match(/^#join-[A-Za-z]{4}(?:-(gcse|alevel))?$/);
  if(j)p=j[1]||"alevel";   // a join link opens the host's course (A-level unless it says -gcse) without changing the saved choice
  window.RM.profile=p;
  if(p)document.write('<script src="data/'+p+'/spec.js"><\/script><script src="data/'+p+'/generators.js"><\/script>');
})();
</script>

<script>
"use strict";
/* =====================================================================
   REP MAX — a revision gym for A-level and GCSE.
   Course map · Solo gym · Daily challenge · Live quiz night · Question maker (quizzes: A-level so far)
   Everything runs in the browser. Progress is saved on this device only.
   Live games travel through public MQTT relays (no accounts): use nicknames.
   ===================================================================== */
const VERSION="1.9.1";
const LAUNCH="2026-11-14";                 // daily challenge #1
/* The two courses. quiz:false = course map and tracker only (for a course with no questions yet); pre = id prefix for new questions. */
const PROFILES={
  alevel:{label:"A-level",tag:"A-LEVEL GYM",quiz:true,subj:{
    maths:  {name:"Maths",short:"Maths",col:"var(--maths)",em:"∑",pre:"ma"},
    further:{name:"Further Maths",short:"Further",col:"var(--further)",em:"∫",pre:"fm"},
    chem:   {name:"Chemistry",short:"Chem",col:"var(--chem)",em:"⚗️",pre:"ch"},
    cs:     {name:"Computer Science",short:"CS",col:"var(--cs)",em:"💻",pre:"cs"}}},
  gcse:{label:"GCSE",tag:"GCSE",quiz:true,subj:{
    english_lang:{name:"English Language",short:"Eng Lang",col:"#e6a23c",em:"📖",pre:"gel"},
    english_lit: {name:"English Literature",short:"Eng Lit",col:"#d97757",em:"🎭",pre:"gli"},
    maths:       {name:"Maths",short:"Maths",col:"var(--maths)",em:"∑",pre:"gma"},
    biology:     {name:"Biology",short:"Bio",col:"#33d17a",em:"🧬",pre:"gbi"},
    chemistry:   {name:"Chemistry",short:"Chem",col:"var(--chem)",em:"⚗️",pre:"gch"},
    physics:     {name:"Physics",short:"Phys",col:"#4da3ff",em:"⚛️",pre:"gph"},
    rs:          {name:"Religious Studies",short:"RS",col:"#b27cff",em:"🕊️",pre:"grs"},
    history:     {name:"History",short:"History",col:"#c9a227",em:"🏰",pre:"ghi"},
    dt:          {name:"Design and Technology",short:"DT",col:"#ff7a2f",em:"🛠️",pre:"gdt"},
    business:    {name:"Business",short:"Business",col:"#5bc0be",em:"💼",pre:"gbu"}}}
};
const PROFILE=window.RM.profile;                     // null until a course is chosen
const PRO=PROFILES[PROFILE]||{label:"",tag:"",quiz:false,subj:{}};
if(PRO.label)document.title="Rep Max · "+PRO.label+" (test version)";
if(window.RM.quiz===false)PRO.quiz=false;            // data/<course>/spec.js says no question files exist yet
const SUBJ=PRO.subj;
const QSUBJ=Array.isArray(window.RM.quiz)?window.RM.quiz.filter(k=>SUBJ[k]):null;   // subjects with question files (null = all)
const SKEYS=Object.keys(SUBJ);
const LVNAME={1:"Warm-up",2:"Working set",3:"1-rep max"};
const XP_LV={1:10,2:20,3:40};
const RANKS=[[0,"Day One"],[150,"Starter"],[400,"Regular"],[900,"Lifter"],[1800,"Spotter"],[3200,"PB Hunter"],[5200,"Top Set"],[8000,"Plate Loaded"],[12000,"Rep Max"]];
const SHAPES=["▲","◆","●","■"];
const BADGES=["⚡","🚀","🧪","💻","🧮","🧠","🎧","🐉","👑","🎯","🛰️","🔭","⚙️","🧲","🪐","♟️","🎲","🌀","🔷","⭐"];
const NAME_A=["Cobalt","Argon","Scalar","Prime","Binary","Quantum","Cosmic","Rapid","Atomic","Electric","Static","Lateral","Null","Vector","Turbo","Iron"];
const NAME_B=["Heron","Otter","Falcon","Lynx","Kestrel","Badger","Pike","Raven","Tangent","Matrix","Proton","Pointer","Photon","Isotope","Radian","Buffer"];

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LS_PFX=PROFILE==="gcse"?"rmt_gcse_":"rmt_";   // each course keeps its own progress on a shared device
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS_PFX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(LS_PFX+k):localStorage.setItem(LS_PFX+k,JSON.stringify(v));}catch(e){}};
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function londonDate(d=new Date()){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);}catch(e){return d.toISOString().slice(0,10);}}
function dayDiff(a,b){return Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);}

/* ---------- maths rendering: text with $...$ segments ---------- */
function tex(s){
  const parts=String(s??"").split(/(\$[^$]+\$)/g);
  return parts.map(p=>{
    if(p.length>2&&p[0]==="$"&&p[p.length-1]==="$"){
      const t=p.slice(1,-1);
      if(window.katex){try{return katex.renderToString(t,{throwOnError:false,output:"html"});}catch(e){}}
      return '<span class="tex-raw" data-tex="'+esc(t)+'">'+esc(t)+'</span>';
    }
    return esc(p);
  }).join("");
}
window.addEventListener("katex-ready",()=>{document.querySelectorAll(".tex-raw").forEach(el=>{try{el.outerHTML=katex.renderToString(el.dataset.tex,{throwOnError:false,output:"html"});}catch(e){}});});

/* ---------- the question bank ----------
   Questions live in data/<subject>.jsonl, one JSON object per line, so one bad
   line is skipped instead of breaking the subject. data/generators.js holds the
   number generators: each makes a fresh version of a calculation every time. */
const SPEC=window.RM.spec||{};
const TOPIC={};            // "subject|id" -> {id,name,year,s,group}
for(const s of SKEYS){for(const g of ((SPEC[s]||{}).groups||[])){for(const t of g.topics){TOPIC[s+"|"+t.id]={...t,s,group:g.name};}}}
const BANK=[],BAD=[],BYID={},CARDS={},LOAD_ERR=[];
function validQ(q){
  if(!q||typeof q.id!=="string"||!SUBJ[q.s]||![1,2,3].includes(q.lv))return false;
  if(q.gen)return typeof q.make==="function";
  return typeof q.q==="string"&&Array.isArray(q.o)&&q.o.length===4&&new Set(q.o).size===4&&Number.isInteger(q.a)&&q.a>=0&&q.a<4;
}
function addQ(q,where){if(validQ(q)&&!BYID[q.id]){BANK.push(q);BYID[q.id]=q;}else BAD.push(where);}
async function readData(name){
  const el=document.getElementById("rm-data-"+PROFILE+"-"+name);if(el)return el.textContent;
  const r=await fetch("data/"+PROFILE+"/"+name+".jsonl",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
}
function parseLines(name,text){
  const out=[];
  String(text).split(/\r?\n/).forEach((line,i)=>{const l=line.trim();if(!l||l.startsWith("//"))return;try{out.push(JSON.parse(l.replace(/,\s*$/,"")));}catch(e){BAD.push(name+".jsonl line "+(i+1));}});
  return out;
}
async function loadAll(){
  if(!PRO.quiz)return;                                  // course map and tracker only
  for(const g of (window.RM.gens||[]))addQ({...g,gen:true},"generator "+((g&&g.id)||"?"));
  await Promise.all(SKEYS.filter(s=>!QSUBJ||QSUBJ.includes(s)).map(async s=>{try{parseLines(s,await readData(s)).forEach((q,i)=>addQ(q,s+".jsonl "+((q&&q.id)||"item "+(i+1))));}catch(e){LOAD_ERR.push(SUBJ[s].name);}}));
  try{for(const c of parseLines("cards",await readData("cards")))if(c&&SUBJ[c.s]&&c.t&&c.key)CARDS[c.s+"|"+c.t]=c;}catch(e){}
  BANK.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  if(BAD.length)console.warn("Rep Max skipped:",BAD);
}
const topicOf=q=>TOPIC[q.s+"|"+q.t]||{id:q.t,name:q.t||"General",year:"",s:q.s,group:""};
function specRef(q){const sp=SPEC[q.s]||{},t=topicOf(q);return ((sp.board||"")+" "+(sp.code||"")+" · "+(/^\d/.test(t.id)?t.id+" ":"")+t.name).trim();}
/* a generator makes a fresh version each time; a fixed question comes back as it is */
function inst(q,rnd){
  if(!q||!q.gen)return q;
  for(let k=0;k<5;k++){
    try{const r=q.make(rnd||Math.random);
      if(r&&typeof r.q==="string"&&Array.isArray(r.o)&&r.o.length===4&&new Set(r.o).size===4&&r.a>=0&&r.a<4)
        return{q:r.q,code:r.code||"",o:r.o.map(String),a:r.a,x:r.x||"",id:q.id,s:q.s,t:q.t,lv:q.lv,gen:true};
    }catch(e){}
  }
  return null;
}

let NOTYET=lsGet("notyet",{});

/* no two questions on the same topic in a row (daily challenge, reviews, Sprint) */
function mixTopics(qs){const out=[],rest=qs.slice();while(rest.length){const last=out[out.length-1];let k=rest.findIndex(q=>!last||keyOf(q)!==keyOf(last));if(k<0)k=0;out.push(rest.splice(k,1)[0]);}return out;}
/* a forgiving streak: days with a proper set (5 or more answers); one missed day a week is forgiven */
function weekOf(d){const dow=(new Date(d+"T12:00:00Z").getUTCDay()+6)%7;return addDays(d,-dow);}

  for(const [k,v] of Object.entries(s.best||{}))ST.best[k]=Math.max(ST.best[k]||0,v);
  for(const [d,v] of Object.entries(s.daily||{}))if(!ST.daily[d])ST.daily[d]=v;

ACT.gS=d=>{GYM.s=d.s;if(GYM.topic&&!GYM.topic.startsWith(d.s+"|"))GYM.topic=null;lsSet("gym",GYM);gymSetup();};

ACT.gStart=()=>{
  const w=WORKOUTS[GYM.w];
  let pool=BANK.filter(q=>(GYM.s==="mix"||q.s===GYM.s));
  if(GYM.topic)pool=pool.filter(q=>keyOf(q)===GYM.topic);   // one topic chosen in the tracker: ask it whatever the ticks say
  else pool=playable(pool,GYM.taught);
  let qs;
  if(GYM.topic){
    const rank=q=>(ST.q[q.id]?2:0)+(q.gen?0:1);
    qs=shuffle(pool).sort((a,b)=>rank(a)-rank(b)||((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0)).slice(0,w.n);
    const gens=pool.filter(q=>q.gen);for(let k=0;qs.length<w.n&&gens.length;k++)qs.push(gens[k%gens.length]);
  }else if(GYM.w==="weak"){
    const seen=pool.filter(q=>ST.q[q.id]);
    const weak=seen.filter(q=>ST.q[q.id].box===0||isDue(ST.q[q.id])).sort((a,b)=>ST.q[a.id].box-ST.q[b.id].box||ST.q[a.id].last-ST.q[b.id].last);
    const fresh=shuffle(pool.filter(q=>!ST.q[q.id]));
    qs=[...weak,...fresh].slice(0,w.n);
  }else{
    let p=pool.filter(q=>w.lv.includes(q.lv));
    p=shuffle(p).sort((a,b)=>((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0));   // least recently seen first
    qs=shuffle(p.slice(0,Math.max(w.n,Math.min(p.length,w.n*2)))).slice(0,w.n);
  }
  qs=qs.map(q=>inst(q)).filter(Boolean);
  if(!qs.length){$("#gmsg").textContent="No questions match those settings yet. Try another subject or workout, or check what you've covered.";return;}
  const label=w.name+" · "+(GYM.topic?TOPIC[GYM.topic].name:GYM.s==="mix"?"Mixed":SUBJ[GYM.s].name);
  startRun({mode:"gym",qs,label,clock:GYM.clock,key:GYM.w+"|"+(GYM.topic||GYM.s)});
};

let RUN=null,RT=null;
function startRun(o){
  const rnd=o.seed!=null?mulberry32(o.seed):Math.random;
  RUN={...o,i:0,res:[],combo:0,best:0,xp:0,score:0,perms:o.qs.map(()=>shuffle([0,1,2,3],rnd)),t0:Date.now()};
  showQ();
}
function qDur(q){return RUN.mode==="daily"?(q.lv===3?75:45):(q.lv===3?60:30);}
function showQ(){
  clearInterval(RT);
  const q=RUN.qs[RUN.i],perm=RUN.perms[RUN.i],tp=topicOf(q);
  RUN.locked=false;RUN.start=Date.now();
  const timed=!!RUN.clock;
  render(`<div class="wrap">
  <div class="top"><button class="icon-btn" data-act="quitRun" aria-label="Quit">✕</button>
   <div class="hud"><span class="chip">${RUN.mode==="daily"?"Daily · ":""}Rep ${RUN.i+1}/${RUN.qs.length}</span>${RUN.combo>=2?`<span class="combo">🔥 x${RUN.combo}</span>`:""}</div>
   <button class="icon-btn" data-act="mute" aria-label="Sound">${MUTED?"🔇":"🔊"}</button></div>
  ${timed?`<div class="timer" id="tm"><i></i><b></b></div>`:""}
  <div class="qbox"><div class="row" style="margin-bottom:10px">${subjTag(q.s)}${lvTag(q.lv)}<span class="small muted">${esc(tp.name)}</span></div>
   <div class="qtext">${tex(q.q)}</div>${codeHtml(q.code)}
   <div class="opts">${perm.map((k,i)=>`<button class="opt o${i}" data-act="pickOpt" data-i="${i}" data-silent="1"><span class="sh">${SHAPES[i]}</span><span>${tex(q.o[k])}</span></button>`).join("")}</div>
   <div id="fb"></div>
   ${q.gen?`<div class="small muted" style="margin-top:12px">Fresh numbers every time</div>`:""}</div></div>`,"run");
  if(timed){
    const dur=qDur(q)*1000;
    tmSet($("#tm"),dur,dur);runTimer();
  }
}
function runTimer(){clearInterval(RT);const q=RUN.qs[RUN.i],dur=qDur(q)*1000;RT=setInterval(()=>{if(!RUN){clearInterval(RT);return;}const left=dur-(Date.now()-RUN.start);const el=$("#tm");if(!el){clearInterval(RT);return;}tmSet(el,left,dur);if(left<=0){clearInterval(RT);answer(-1);}},200);}
ACT.pickOpt=d=>answer(+d.i);
function answer(di){
  if(!RUN||RUN.locked)return;RUN.locked=true;clearInterval(RT);
  const q=RUN.qs[RUN.i],perm=RUN.perms[RUN.i],right=perm.indexOf(q.a),ok=di===right;
  const secs=(Date.now()-RUN.start)/1000,dur=qDur(q);
  recordAnswer(q,ok);
  let xp=0,pts=0;
  if(ok){RUN.combo++;RUN.best=Math.max(RUN.best,RUN.combo);xp=XP_LV[q.lv];pts=100;if(RUN.clock){const f=Math.max(0,1-secs/dur);xp+=Math.round(xp*.5*f);pts+=Math.round(50*f);}if(RUN.combo>=3)xp+=5;}
  else RUN.combo=0;
  RUN.xp+=xp;RUN.score+=pts;
  RUN.res.push({id:q.id,ok,di,secs,timeout:di<0});
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===right){b.classList.add("right");b.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>');}else b.classList.add("dim");if(i===di&&!ok){b.classList.add("mine");b.insertAdjacentHTML("beforeend",'<span class="mark">✗</span>');}});
  if(ok){SFX.correct();if(RUN.combo>=3)SFX.combo();if(!REDUCED)popText("+"+xp+" XP");}else SFX.wrong();
  const last=RUN.i===RUN.qs.length-1,card=CARDS[keyOf(q)];
  const head=ok?(RUN.combo>=3?"🔥 Combo x"+RUN.combo:pick(["Clean rep.","Nailed it.","Strong.","Lift complete."])):di<0?"Out of time.":pick(["Not this one.","Missed."]);
  const auto=ok&&SET.auto!==false&&!REDUCED,iNow=RUN.i,why=!ok&&di>=0&&q.w?q.w[perm[di]]:"";

  if(auto)setTimeout(()=>{if(RUN&&RUN.locked&&RUN.i===iNow&&VIEW==="run"&&!document.querySelector(".modal"))ACT.nextQ();},1100);
}

/* =====================================================================
   DAILY CHALLENGE — 10 questions from what you've covered. Friends on the
   same courses who have ticked the same topics get the same 10.
   ===================================================================== */
let DCLOCK=lsGet("dclock",false);
function dailySet(date){
  const rnd=mulberry32(hashStr("repmax-daily-"+date));
  let pool=playable(BANK,true);
  if(!pool.length)pool=playable(BANK,false);   // ticks only in subjects with no questions yet: use every topic
  const subs=SKEYS.filter(s=>pool.some(q=>q.s===s&&q.lv<=2));
  const lists=Object.fromEntries(subs.map(s=>[s,shuffle(pool.filter(q=>q.s===s&&q.lv<=2),rnd)]));
  const chosen=[];let k=0;
  while(chosen.length<8&&subs.some(s=>lists[s].length)){const s=subs[k++%subs.length];if(lists[s].length)chosen.push(lists[s].shift());}
  const hard=shuffle(pool.filter(q=>q.lv===3&&!chosen.includes(q)),rnd).slice(0,2);
  let qs=[...shuffle(chosen,rnd),...hard];
  if(qs.length<10)qs=qs.concat(shuffle(pool.filter(q=>!qs.includes(q)),rnd).slice(0,10-qs.length));
  return mixTopics(qs.slice(0,10)).map(q=>inst(q,mulberry32(hashStr(date+"|"+q.id)))).filter(Boolean);
}

/* =====================================================================
   LIVE QUIZ NIGHT
   Relay transport adapted from Nose Knows: messages go through every public
   MQTT broker that answers and are de-duplicated on arrival. No accounts.
   The host's screen is in charge: it picks questions, keeps the answer key,
   times each question and scores. Phones send only their pick.
   ===================================================================== */
const PEER_PREFIX="rep-max-v1-";
const MQTT_SRC=["../lib/mqtt.min.js","https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js","https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"];
const BROKERS=[{url:"wss://public.cloud.shiftr.io:443/mqtt",username:"public",password:"public"},{url:"wss://broker.emqx.io:8084/mqtt"},{url:"wss://broker.hivemq.com:8884/mqtt"}];
const RELAY_ROOT="rm-relay-test-v1/";
const rid=(n=12)=>{const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";const r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):null;for(let i=0;i<n;i++)s+=a[(r?r[i]:Math.floor(Math.random()*256))%a.length];return s;};
class RelayEmitter{constructor(){this._h={};}on(e,f){(this._h[e]=this._h[e]||new Set()).add(f);return this;}off(e,f){if(this._h[e])this._h[e].delete(f);return this;}emit(e,...a){[...(this._h[e]||[])].forEach(f=>{try{f(...a);}catch(x){console.error(x);}});}}
class RelayConn extends RelayEmitter{
  constructor(peer,remote,cid){super();this._peer=peer;this.remote=remote;this.cid=cid;this.open=false;this.lastSeen=Date.now();}
  send(obj){if(!this.open)throw new Error("closed");this._peer._pub(this.remote,{t:"d",cid:this.cid,d:obj});}
  close(){if(this._dropped)return;try{this._peer._pub(this.remote,{t:"x",cid:this.cid});}catch(e){}this._drop();}
  _drop(){if(this._dropped)return;this._dropped=true;this.open=false;this._peer.conns.delete(this.cid);clearInterval(this._retry);this.emit("close");}
}
class RelayPeer extends RelayEmitter{
  constructor(id){super();this.claim=typeof id==="string";this.id=this.claim?id:"p-"+rid(14);this.destroyed=false;this.conns=new Map();this.clients=[];this.nonce=rid(10);this._seen=new Set();this._seenQ=[];this._open=false;this._taken=false;setTimeout(()=>this._start(),0);}
  get disconnected(){return !this.clients.some(c=>c.connected);}
  _topic(id){return RELAY_ROOT+id;}
  _start(){
    let first=true;
    const failT=setTimeout(()=>{if(first&&!this.destroyed)this.emit("error",{type:"network"});},12000);
    for(const b of BROKERS){
      let c;try{c=mqtt.connect(b.url,{clientId:"rm_"+rid(14),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30,...(b.username?{username:b.username,password:b.password}:{})});}catch(e){continue;}
      this.clients.push(c);
      c.on("connect",()=>{c.subscribe(this._topic(this.id),{qos:0},()=>{if(first&&!this.destroyed){first=false;clearTimeout(failT);this._ready();}});});
      c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString());}catch(e){return;}this._recv(m);});
      c.on("error",()=>{});
    }
    if(!this.clients.length){clearTimeout(failT);setTimeout(()=>this.emit("error",{type:"network"}));}
    this._hb=setInterval(()=>this._beat(),5000);
  }
  _ready(){
    if(!this.claim){this._open=true;this.emit("open",this.id);return;}
    try{this._pub(this.id,{t:"probe",n:this.nonce});}catch(e){}
    setTimeout(()=>{if(this.destroyed)return;if(this._taken){this.emit("error",{type:"unavailable-id"});this.destroy();return;}this._open=true;this.emit("open",this.id);},1800);
  }
  _pub(target,msg){const live=this.clients.filter(c=>c.connected);if(!live.length)throw new Error("offline");msg.from=this.id;msg.mid=rid(12);const s=JSON.stringify(msg),t=this._topic(target);live.forEach(c=>{try{c.publish(t,s,{qos:0});}catch(e){}});}
  _dup(mid){if(!mid)return false;if(this._seen.has(mid))return true;this._seen.add(mid);this._seenQ.push(mid);if(this._seenQ.length>4000)this._seen.delete(this._seenQ.shift());return false;}
  _recv(m){
    if(!m||typeof m!=="object"||this.destroyed||this._dup(m.mid))return;
    const c=m.cid&&this.conns.get(m.cid);
    switch(m.t){
      case "probe":if(m.n===this.nonce)return;if(this.claim&&this._open)try{this._pub(this.id,{t:"taken",n:m.n});}catch(e){}return;
      case "taken":if(m.n===this.nonce)this._taken=true;return;
      case "open":{
        if(!this._open||typeof m.from!=="string"||typeof m.cid!=="string")return;
        if(c){try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}return;}
        const conn=new RelayConn(this,m.from,m.cid);this.conns.set(m.cid,conn);this.emit("connection",conn);
        conn.open=true;try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}setTimeout(()=>conn.emit("open"));return;}
      case "ack":if(c&&!c.open&&c.remote===m.from){c.open=true;c.lastSeen=Date.now();clearInterval(c._retry);c.emit("open");}return;
      case "d":if(c&&c.remote===m.from){c.lastSeen=Date.now();if(c.open)c.emit("data",m.d);}else if(this.claim&&m.from)try{this._pub(m.from,{t:"x",cid:m.cid});}catch(e){}return;
      case "hb":if(c&&c.remote===m.from)c.lastSeen=Date.now();return;
      case "x":if(c&&c.remote===m.from)c._drop();return;
    }
  }
  _beat(){const now=Date.now();for(const c of [...this.conns.values()]){if(!c.open)continue;if(now-c.lastSeen>17000){c._drop();continue;}try{this._pub(c.remote,{t:"hb",cid:c.cid});}catch(e){}}}
  connect(target){
    const cid=rid(14),conn=new RelayConn(this,target,cid);this.conns.set(cid,conn);
    const ask=()=>{try{this._pub(target,{t:"open",cid});}catch(e){}};
    ask();conn._retry=setInterval(()=>{if(conn.open||conn._dropped)return clearInterval(conn._retry);ask();},1500);
    setTimeout(()=>{if(!conn.open&&!conn._dropped){clearInterval(conn._retry);this.conns.delete(cid);conn._dropped=true;conn.emit("fail");}},8000);
    return conn;
  }
  reconnect(){this.clients.forEach(c=>{if(!c.connected)try{c.reconnect();}catch(e){}});}
  destroy(){if(this.destroyed)return;this.destroyed=true;clearInterval(this._hb);[...this.conns.values()].forEach(c=>c.close());this.clients.forEach(c=>{try{c.end(true);}catch(e){}});}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadMqtt(){if(!window.mqtt){for(const s of MQTT_SRC){try{await loadScript(s);if(window.mqtt)break;}catch(e){}}}return !!window.mqtt;}
function peerOnce(id){
  return new Promise((res,rej)=>{
    let p;try{p=new RelayPeer(id);}catch(e){return rej({type:"init"});}
    const t=setTimeout(()=>{try{p.destroy();}catch(e){}rej({type:"timeout"});},14000);
    const onErr=e=>{clearTimeout(t);try{p.destroy();}catch(x){}rej({type:e&&e.type||"error"});};
    p.on("open",()=>{clearTimeout(t);p.off("error",onErr);res(p);});p.on("error",onErr);
  });
}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
const myPid=()=>{let p=lsGet("pid",null);if(!p){p="p"+rid(10);lsSet("pid",p);}return p;};
const GRACE=1500;
function ptsFor(ms,dur){return 800+Math.round(200*Math.max(0,1-ms/(dur*1000)));}
let wakeLock=null,WANT_WAKE=false,HID_AT=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){HID_AT=Date.now();if(RUN&&RUN.clock&&!RUN.locked)clearInterval(RT);if(SP)clearInterval(SPT);}else{const gap=HID_AT?Date.now()-HID_AT:0;HID_AT=0;if(RUN&&RUN.clock&&!RUN.locked&&VIEW==="run"){RUN.start+=gap;runTimer();}if(SP&&VIEW==="sprintq"){SP.end+=gap;clearInterval(SPT);SPT=setInterval(spTick,200);}if(WANT_WAKE)keepAwake();}});

  const seg=(key,vals,lab)=>vals.map(v=>`<button class="chip ${HS[key]===v?"on":""}" data-act="hsSet" data-k="${key}" data-v="${v}">${lab(v)}</button>`).join("");

  <button class="btn go block" data-act="hostOpen" style="font-size:18px;padding:16px">Open the room</button>
  <p class="small muted center" id="hmsg">Players join on their own devices with a 4-letter code. Nicknames only: names and answers pass through public relays. A right answer scores 800, plus up to 200 for speed.</p></div>`,"hostSetup");
};
ACT.hsSub=d=>{const i=HS.subs.indexOf(d.s);if(i>=0){if(HS.subs.length>1)HS.subs.splice(i,1);}else HS.subs.push(d.s);lsSet("host",HS);ACT.hostSetup();};
ACT.hsSet=d=>{HS[d.k]=isNaN(+d.v)?d.v:+d.v;lsSet("host",HS);ACT.hostSetup();};
ACT.hsTog=d=>{HS[d.k]=!HS[d.k];lsSet("host",HS);ACT.hostSetup();};
function hostPool(){
  let p=playable(BANK.filter(q=>HS.subs.includes(q.s)),HS.taught);
  if(HS.lv==="easy")p=p.filter(q=>q.lv<=2);else if(HS.lv==="max")p=p.filter(q=>q.lv===3);
  return p;
}
function hostDeal(){return shuffle(hostPool()).slice(0,HS.n*2).map(q=>inst(q)).filter(Boolean).slice(0,HS.n);}
ACT.hostOpen=async()=>{
  if(!hostPool().length){$("#hmsg").textContent="No questions match those settings.";return;}
  $("#hmsg").textContent="Opening a room…";
  if(!(await loadMqtt())){$("#hmsg").textContent="Couldn't load the connection library. Check the internet connection.";return;}
  let peer=null,code=null;
  for(let i=0;i<8&&!peer;i++){code=genCode();try{peer=await peerOnce(PEER_PREFIX+code);}catch(e){if(e.type!=="unavailable-id"){$("#hmsg").textContent="Couldn't open a room ("+e.type+"). The network may block live connections: try another Wi-Fi or a phone hotspot.";return;}}}
  if(!peer){$("#hmsg").textContent="Couldn't get a free room code. Try again.";return;}
  H={peer,code,qs:hostDeal(),game:1,conns:new Map(),players:new Map(),phase:"lobby",i:-1,cur:null,answers:new Map(),autoT:null,qT:null,hostPid:"h-"+myPid()};
  if(HS.play)H.players.set(H.hostPid,{pid:H.hostPid,name:ME.name,badge:ME.badge,score:0,streak:0,host:true,online:true});
  peer.on("connection",conn=>{
    conn.on("data",m=>hostRecv(conn,m));
    conn.on("close",()=>{if(conn._pid&&H&&H.conns.get(conn._pid)===conn){H.conns.delete(conn._pid);const p=H.players.get(conn._pid);if(p)p.online=false;hostRefresh();}});
  });
  peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});
  H.syncT=setInterval(()=>{if(!H)return;for(const [pid,c] of H.conns)hsend(c,{...stateFor(pid),sync:1});},3000);   // relays can drop messages: re-send the current state
  keepAwake();
  hostRender();
};
function hostRecv(conn,m){
  if(!H||!m||typeof m!=="object")return;
  if(m.t==="hello"){
    const pid=String(m.pid||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);if(!pid)return;
    const name=String(m.name||"Player").replace(/[<>]/g,"").slice(0,22)||"Player",badge=String(m.badge||"⭐").slice(0,8);
    conn._pid=pid;const old=H.conns.get(pid);if(old&&old!==conn)try{old.close();}catch(e){}
    H.conns.set(pid,conn);
    const p=H.players.get(pid);
    if(p){p.name=name;p.badge=badge;p.online=true;}else H.players.set(pid,{pid,name,badge,score:0,streak:0,online:true});
    hsend(conn,stateFor(pid));hostRefresh();
    if(H.phase==="lobby")broadcast(lobbyMsg());
    return;
  }
  if(m.t==="ans")hostTakeAnswer(conn._pid,m.n,m.c);
}
function hostTakeAnswer(pid,n,c){
  if(!H||!pid||H.phase!=="q"||n!==H.i||H.answers.has(pid)||!H.players.has(pid))return;
  const ms=Date.now()-H.cur.start;if(ms>H.cur.dur*1000+GRACE)return;
  c=+c;if(!(c>=0&&c<4))return;
  H.answers.set(pid,{c,ms});
  const box=$("#hAns");if(box)box.textContent=H.answers.size+" / "+activeCount()+" answered";
  if(H.answers.size>=activeCount())setTimeout(()=>{if(H&&H.phase==="q"&&H.cur&&n===H.i)hostReveal();},400);
}
const activeCount=()=>[...H.players.values()].filter(p=>p.online||p.host).length;
const send=(c,o)=>{try{c.send(o);}catch(e){}};
const hsend=(c,o)=>send(c,{...o,g:H?H.game:0});
function broadcast(o){if(!H)return;for(const c of H.conns.values())hsend(c,o);}
function playerList(){return [...H.players.values()].map(p=>({pid:p.pid,name:p.name,badge:p.badge,online:!!(p.online||p.host)}));}
function boardList(){return [...H.players.values()].sort((a,b)=>b.score-a.score).map((p,i)=>({pid:p.pid,name:p.name,badge:p.badge,score:p.score,pos:i+1}));}
function lobbyMsg(){return{t:"lobby",players:playerList(),code:H.code,subs:HS.subs.map(s=>SUBJ[s].name),n:H.qs.length};}
function qMsg(){const q=H.cur.q;return{t:"q",n:H.i,total:H.qs.length,dur:H.cur.dur,left:Math.max(0,H.cur.dur*1000-(Date.now()-H.cur.start)),q:{s:q.s,t:topicOf(q).name,lv:q.lv,q:q.q,code:q.code||"",o:H.cur.perm.map(k=>q.o[k])}};}
function stateFor(pid){
  if(H.phase==="lobby")return lobbyMsg();
  if(H.phase==="q"){const m=qMsg();m.mine=H.answers.has(pid)?H.answers.get(pid).c:null;return m;}
  if(H.phase==="rev")return{...H.lastRev,you:H.lastRev.res[pid]||null};
  return{t:"end",board:boardList()};
}
function hostStart(){if(!H||H.phase!=="lobby"||!H.qs.length)return;hostQuestion(0);}
function hostQuestion(i){
  clearTimeout(H.autoT);clearInterval(H.qT);
  H.i=i;H.phase="q";H.answers=new Map();
  const q=H.qs[i];H.cur={q,perm:shuffle([0,1,2,3]),start:Date.now(),dur:HS.dur*(q.lv===3?2:1)};
  broadcast(qMsg());hostRender();SFX.plate();
  H.qT=setInterval(()=>{
    if(!H||H.phase!=="q")return clearInterval(H.qT);
    const left=H.cur.dur*1000-(Date.now()-H.cur.start),el=$("#tm");
    if(el)tmSet(el,left,H.cur.dur*1000);
    const sec=$("#hSec");if(sec)sec.textContent=Math.max(0,Math.ceil(left/1000));
    if(left<=-GRACE){clearInterval(H.qT);hostReveal();}
  },200);
}
function hostReveal(){
  if(!H||H.phase!=="q")return;clearInterval(H.qT);
  const q=H.cur.q,right=H.cur.perm.indexOf(q.a),res={},counts=[0,0,0,0];
  for(const [pid,p] of H.players){
    const a=H.answers.get(pid);
    if(a)counts[a.c]++;
    if(a&&a.c===right){p.streak++;const pts=ptsFor(a.ms,H.cur.dur)+Math.min(150,(p.streak-1)*50);p.score+=pts;res[pid]={ok:true,pts,c:a.c,streak:p.streak};}
    else{p.streak=0;res[pid]={ok:false,pts:0,c:a?a.c:null};}
  }
  const board=boardList();board.forEach(b=>{if(res[b.pid])res[b.pid].pos=b.pos;});
  H.phase="rev";H.lastRev={t:"rev",n:H.i,total:H.qs.length,a:right,x:q.x||"",counts,res,board:board.slice(0,5),players:board.length,q:{q:q.q,code:q.code||"",o:H.cur.perm.map(k=>q.o[k])}};
  for(const [pid,c] of H.conns)hsend(c,{...H.lastRev,you:res[pid]||null});
  if(HS.play){const mine=res[H.hostPid];if(mine)recordAnswer(q,mine.ok);}
  hostRender();
  if(HS.auto)H.autoT=setTimeout(()=>{if(H&&H.phase==="rev")hostNext();},HS.auto*1000);
}
function hostNext(){if(!H)return;clearTimeout(H.autoT);if(H.i+1<H.qs.length)hostQuestion(H.i+1);else hostEnd();}
function hostEnd(){
  clearTimeout(H.autoT);clearInterval(H.qT);H.phase="end";
  broadcast({t:"end",board:boardList()});
  if(HS.play){const me=H.players.get(H.hostPid);if(me){addXP(me.score/50);ST.live++;saveST();}}
  hostRender();SFX.fanfare();confetti();
}
ACT.hStart=()=>hostStart();
ACT.hNext=()=>hostNext();
ACT.hReveal=()=>hostReveal();
ACT.hEnd=()=>hostEnd();

  if(!H)return;clearTimeout(H.autoT);clearInterval(H.qT);
  H.game++;H.qs=hostDeal();H.phase="lobby";H.i=-1;H.cur=null;H.lastRev=null;H.answers=new Map();
  for(const p of H.players.values()){p.score=0;p.streak=0;}
  broadcast(lobbyMsg());hostRender();
};

function playerChips(){return [...H.players.values()].map(p=>`<span class="chip" style="${p.online||p.host?"":"opacity:.45"}">${esc(p.badge)} ${esc(p.name)}${p.host?" (host)":""}</span>`).join("")||`<span class="muted">Waiting for players…</span>`;}

  const top=`<div class="top ttop"><div class="logo"><span class="lg">${icn("🏋️")}</span><div>REP <b>MAX</b><small>QUIZ NIGHT · ROOM ${H.code}</small></div></div><div class="row"><button class="icon-btn" data-act="mute" aria-label="Sound">${MUTED?"🔇":"🔊"}</button><button class="btn" data-act="closeRoom">Close room</button></div></div>`;
  if(H.phase==="lobby"){
    render(`<div class="wrap">${top}
    <div class="grid2"><div class="card center"><div class="muted">Join on your device: open Rep Max, tap <b>Join a game</b>, enter</div><div class="code-big" style="margin:10px 0">${H.code}</div><div class="muted small">or scan</div><div id="qr" class="qr" style="margin-top:8px"></div><div style="margin-top:10px"><button class="btn" data-act="hCopy">Copy join link</button></div></div>
    <div class="card"><h3>Players (<span>${H.players.size}</span>)</h3><div class="pchips" id="hPlayers">${playerChips()}</div>
    <div class="hr"></div><div class="small muted">${H.game>1?"Round "+H.game+" · ":""}${H.qs.length} questions · ${HS.subs.map(s=>SUBJ[s].short).join(", ")} · ${HS.dur} s each</div>
    <button class="btn go block" style="margin-top:14px;font-size:20px;padding:16px" data-act="hStart" ${H.players.size&&H.qs.length?"":"disabled"}>Start the quiz</button></div></div></div>`,"host");
    drawQR(joinLink(H.code));return;
  }
  if(H.phase==="q"){
    const m=qMsg(),q=m.q,mine=H.answers.get(H.hostPid);
    render(`<div class="wrap">${top}
    <div class="row"><span class="chip">Question ${H.i+1}/${H.qs.length}</span>${subjTag(q.s)}${lvTag(q.lv)}<span class="muted small">${esc(q.t)}</span><span class="spacer"></span><span class="chip" id="hAns">${H.answers.size} / ${activeCount()} answered</span><span class="big-num" id="hSec" style="font-size:34px;min-width:50px;text-align:right">${Math.ceil(m.left/1000)}</span></div>
    <div class="timer" id="tm"><i></i><b></b></div>

function plConnect(first){
  return new Promise(res=>{
    if(!PL||PL.closed)return res(false);
    const c=PL.peer.connect(PEER_PREFIX+PL.code);let done=false;
    c.on("open",()=>{if(done)return;done=true;PL.conn=c;send(c,{t:"hello",pid:PL.pid,name:ME.name,badge:ME.badge});res(true);plStatus(true);});
    c.on("fail",()=>{if(done)return;done=true;res(false);});
    c.on("data",m=>plRecv(m));
    c.on("close",()=>{if(PL&&PL.conn===c){PL.conn=null;plStatus(false);if(!PL.closed)plReconnect();}});
    if(first)setTimeout(()=>{if(!done){done=true;res(false);}},10000);
  });
}
async function plReconnect(){
  if(!PL||PL.reconnecting)return;PL.reconnecting=true;
  for(let i=0;PL&&!PL.closed&&!PL.conn;i++){await sleep(Math.min(5000,1200+i*600));if(!PL||PL.closed)break;try{if(PL.peer.disconnected)PL.peer.reconnect();}catch(e){}await plConnect(false);}
  if(PL)PL.reconnecting=false;
}
function plStatus(on){const el=$("#plDot");if(el)el.classList.toggle("off",!on);const t=$("#plConn");if(t)t.textContent=on?"connected":"reconnecting…";}
function plTop(){return `<div class="top"><div class="row"><span class="chip">${esc(ME.badge)} ${esc(ME.name)}</span></div><div class="row small muted"><span class="status-dot ${PL&&PL.conn?"":"off"}" id="plDot"></span><span id="plConn">${PL&&PL.conn?"connected":"reconnecting…"}</span><span class="chip">Room ${esc(PL?PL.code:"")}</span><button class="icon-btn" data-act="leaveGame" aria-label="Leave">✕</button></div></div>`;}
function plRecv(m){
  if(!PL||!m||typeof m!=="object")return;
  for(const k of ["n","dur","left","a","players","total","g"])if(m[k]!=null&&!Array.isArray(m[k]))m[k]=Number(m[k])||0;
  if(m.you){m.you.pts=Number(m.you.pts)||0;m.you.pos=Number(m.you.pos)||0;m.you.streak=Number(m.you.streak)||0;m.you.c=m.you.c==null?null:Number(m.you.c);}
  if(Array.isArray(m.board))m.board=m.board.map(b=>({...b,pos:Number(b.pos)||0,score:Number(b.score)||0}));
  if(m.g!=null&&m.g!==PL.g){PL.g=m.g;PL.n=undefined;PL.revN=-1;PL.xpDone=false;PL.mine=null;PL.lobbySig=null;if(PL.phase!=="connecting")PL.phase="new";}   // a new round in the same room
  if(m.t==="lobby"){
    const sig=JSON.stringify([m.players,m.subs,m.n]);if(PL.phase==="lobby"&&PL.lobbySig===sig)return;PL.lobbySig=sig;PL.phase="lobby";clearInterval(PL.timer);
    render(`<div class="wrap">${plTop()}<div class="card center"><div style="font-size:48px">${esc(ME.badge)}</div><h2>You're in!</h2><p class="muted">Waiting for the host to start…</p>${m.subs?`<p class="small muted">Tonight: ${esc(m.subs.join(", "))} · ${m.n} questions</p>`:""}</div><div class="card"><h3>In the room</h3><div class="pchips">${(m.players||[]).map(p=>`<span class="chip" style="${p.online?"":"opacity:.45"}">${esc(p.badge)} ${esc(p.name)}</span>`).join("")}</div></div></div>`,"play");
    return;
  }
  if(m.t==="q"){
    if(PL.phase==="q"&&PL.n===m.n){if(m.mine==null&&PL.mine!=null&&PL.conn)send(PL.conn,{t:"ans",n:PL.n,c:PL.mine});return;}   // already showing it; re-send a lost answer
    if((PL.phase==="rev"&&PL.revN>=m.n)||PL.phase==="end")return;
    PL.phase="q";PL.n=m.n;PL.q=m.q;PL.mine=m.mine;PL.dur=m.dur;PL.start=Date.now()-(m.dur*1000-m.left);
    plRenderQ();SFX.plate();return;
  }
  if(m.t==="rev"){
    if((PL.phase==="rev"&&PL.revN===m.n)||PL.phase==="end")return;
    PL.phase="rev";PL.revN=m.n;clearInterval(PL.timer);const y=m.you||{ok:false,pts:0,c:null};
    if(y.ok){SFX.correct();if((y.streak||0)>=3)SFX.combo();}else SFX.wrong();
    recordLive(y.ok);
    const q=m.q||PL.q||{o:["","","",""],q:""};
    render(`<div class="wrap">${plTop()}
     <div class="card center" style="border-color:${y.ok?"#2f6b24":"#6b2a33"}"><div style="font-size:52px">${y.ok?"✅":y.c==null?"⏱":"❌"}</div><h2 style="margin:6px 0">${y.ok?"+"+fmt(y.pts)+" points":y.c==null?"No answer":"Not this time"}</h2>
     ${y.ok&&(y.streak||0)>=2?`<div class="combo">🔥 Streak x${y.streak}</div>`:""}<p class="muted">${y.pos?`You're #${y.pos} of ${m.players}`:""}</p></div>
     <div class="qbox"><div>${tex(q.q)}</div><div style="margin-top:10px"><b style="color:var(--lime)">Answer:</b> ${tex(q.o[m.a])}</div><div class="small muted" style="margin-top:6px">${tex(m.x)}</div></div>
     <div class="card"><h3>Top 5</h3>${boardHtml(m.board,PL.pid)}</div></div>`,"play");
    return;
  }
  if(m.t==="closed"){
    PL.closed=true;clearInterval(PL.timer);
    render(`<div class="wrap">${topBar("Quiz night")}<div class="card center"><div style="font-size:48px">🏁</div><h2>The host closed the room.</h2><p class="muted">Thanks for playing.</p></div><button class="btn block" data-act="home">Home</button></div>`,"play");
    return;
  }
  if(m.t==="end"){
    if(PL.phase==="end")return;
    PL.phase="end";clearInterval(PL.timer);const me=(m.board||[]).find(b=>b.pid===PL.pid);
    if(me&&!PL.xpDone){PL.xpDone=true;addXP(me.score/50);ST.live++;saveST();}
    if(me&&me.pos===1&&me.score>0){SFX.fanfare();confetti();}

    <div class="card">${boardHtml(m.board||[],PL.pid)}</div><button class="btn block" data-act="home">Home</button></div>`,"play");
  }
}

/* =====================================================================
   SPRINT (16 Nov 2026): as many questions as possible against one clock.
   Points by level, so harder questions are worth more: level 1 = 1, level 2 = 2, level 3 = 3.
   A wrong answer costs 3 seconds; Skip costs 2 seconds, so a hard question never traps you.
   Answers count towards the tracker and spaced repetition like any other rep. Best score per course,
   subject and length is kept on this device.
   ===================================================================== */
const SPRINT_LENS=[60,120,180];
let SPS=Object.assign({len:60},lsGet("sprint",{}));
if(!SPRINT_LENS.includes(SPS.len))SPS.len=60;
let SP=null,SPT=null;
const SP_PTS={1:1,2:2,3:3},SP_WRONG=3,SP_SKIP=2;
ACT.sprint=()=>{
  setWide(false);
  const sChips=["mix",...SKEYS.filter(s=>!QSUBJ||QSUBJ.includes(s))].map(s=>`<button class="chip ${GYM.s===s?"on":""}" data-act="spS" data-s="${s}">${s==="mix"?icn("🎲",1)+"Mixed":icn(SUBJ[s].em,1)+esc(SUBJ[s].name)}</button>`).join("");
  const lens=SPRINT_LENS.map(l=>`<button class="chip ${SPS.len===l?"on":""}" data-act="spL" data-l="${l}">${l<120?l+" s":l/60+" min"}</button>`).join("");
  const best=ST.best["sprint|"+SPS.len+"|"+GYM.s];
  render(`<div class="wrap">${topBar("Sprint")}
  <div class="card"><b style="font-size:18px">⚡ As many as you can</b><p class="small muted" style="margin:6px 0 0">One clock for the whole sprint. Level 1 questions score 1 point, level 2 score 2, level 3 score 3. A wrong answer costs ${SP_WRONG} seconds; Skip costs ${SP_SKIP}. Sprint uses questions you have already got right, topped up with warm-ups, so it is fast recall, not new learning.</p></div>
  <div class="card"><h3>Subject</h3><div class="pchips">${sChips}</div></div>
  <div class="card"><h3>Length</h3><div class="pchips">${lens}</div>
  <div class="small muted" style="margin-top:8px">Your best here: ${best?best+" points":"none yet"}</div></div>
  <div class="card">${coverRow("spTaught",GYM.taught,"sprint")}</div>
  <button class="btn go block" data-act="spGo" style="font-size:18px;padding:16px">Start sprint</button>
  <p class="small muted center" id="spmsg"></p></div>`,"sprint");
};
ACT.spS=d=>{GYM.s=d.s;GYM.topic=null;lsSet("gym",GYM);ACT.sprint();};
ACT.spL=d=>{SPS.len=+d.l;lsSet("sprint",SPS);ACT.sprint();};
ACT.spTaught=()=>{GYM.taught=!GYM.taught;lsSet("gym",GYM);ACT.sprint();};
function spPool(){const all=playable(BANK.filter(q=>GYM.s==="mix"||q.s===GYM.s),GYM.taught);const known=all.filter(q=>((ST.q[q.id]||{}).c||0)>=1);if(known.length>=20)return known;const warm=all.filter(q=>q.lv===1&&!known.includes(q));return known.concat(warm.length?warm:all.filter(q=>!known.includes(q)));}
ACT.spGo=()=>{
  const pool=spPool();
  if(!pool.length){$("#spmsg").textContent="No questions match those settings yet. Try another subject, or check what you've covered.";return;}
  SP={len:SPS.len,s:GYM.s,end:Date.now()+SPS.len*1000,pool:shuffle(pool.slice()),k:0,q:null,perm:null,pts:0,right:0,wrong:0,skips:0,res:[],locked:false};
  spNext();
  clearInterval(SPT);SPT=setInterval(spTick,200);
};
function spTick(){
  if(!SP)return clearInterval(SPT);
  const left=SP.end-Date.now();tmSet($("#tm"),left,SP.len*1000);
  if(left<=0){clearInterval(SPT);spEnd();}
}
function spNext(){
  if(SP.k>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.k=0;}
  if(SP.q){const pk=keyOf(SP.q);for(let j=SP.k;j<Math.min(SP.pool.length,SP.k+8);j++){if(keyOf(SP.pool[j])!==pk){[SP.pool[SP.k],SP.pool[j]]=[SP.pool[j],SP.pool[SP.k]];break;}}}
  let q=null;for(let tries=0;!q&&tries<SP.pool.length;tries++){q=inst(SP.pool[SP.k++]);if(SP.k>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.k=0;}}
  if(!q)return spEnd();
  SP.q=q;SP.perm=shuffle([0,1,2,3]);SP.locked=false;
  render(`<div class="wrap">
  <div class="top"><button class="icon-btn" data-act="spQuit" aria-label="Stop">✕</button>
   <div class="hud"><span class="chip">⚡ ${SP.pts} pts</span><span class="chip">${SP.right} right</span></div>
   <button class="icon-btn" data-act="mute" aria-label="Sound">${MUTED?"🔇":"🔊"}</button></div>
  <div class="timer" id="tm"><i></i><b></b></div>
  <div class="qbox"><div class="row" style="margin-bottom:10px">${subjTag(q.s)}${lvTag(q.lv)}<span class="small muted">+${SP_PTS[q.lv]} pt${SP_PTS[q.lv]>1?"s":""}</span></div>
   <div class="qtext">${tex(q.q)}</div>${codeHtml(q.code)}
   <div class="opts">${SP.perm.map((k,i)=>`<button class="opt o${i}" data-act="spPick" data-i="${i}" data-silent="1"><span class="sh">${SHAPES[i]}</span><span>${tex(q.o[k])}</span></button>`).join("")}</div>
   <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" data-act="spSkip">Skip (−${SP_SKIP} s)</button></div></div></div>`,"sprintq");
  spTick();
}
ACT.spPick=d=>{
  if(!SP||SP.locked)return;SP.locked=true;
  const q=SP.q,right=SP.perm.indexOf(q.a),di=+d.i,ok=di===right;
  recordAnswer(q,ok);SP.res.push({q,ok,di,perm:SP.perm});
  if(ok){SP.right++;SP.pts+=SP_PTS[q.lv];SFX.correct();}else{SP.wrong++;SP.end-=SP_WRONG*1000;SFX.wrong();popText("−"+SP_WRONG+" s");}
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===right)b.classList.add("right");else if(i===di)b.classList.add("mine");else b.classList.add("dim");});
  setTimeout(()=>{if(SP&&SP.end>Date.now())spNext();},ok?350:900);
};
ACT.spSkip=()=>{if(!SP||SP.locked)return;SP.skips++;SP.end-=SP_SKIP*1000;spNext();};
ACT.spQuit=()=>{if(SP&&SP.res&&SP.res.length)askEnd("Stop this sprint?","This sprint won't count.",()=>{clearInterval(SPT);SP=null;home();});else{clearInterval(SPT);SP=null;home();}};   // a sprint stopped early records no score
function spEnd(){
  if(!SP||SP.done)return;SP.done=true;clearInterval(SPT);
  const key="sprint|"+SP.len+"|"+SP.s,prev=ST.best[key]||0,pb=SP.pts>prev&&SP.pts>0;
  if(pb)ST.best[key]=SP.pts;
  addXP(SP.res.filter(r=>r.ok).reduce((a,r)=>a+XP_LV[r.q.lv],0));saveST();
  if(pb&&prev>0){SFX.fanfare();confetti();}
  const n=SP.right+SP.wrong,miss=SP.res.filter(r=>!r.ok);
  render(`<div class="wrap">${topBar("Sprint done","sprint")}
   <div class="card center"><div class="big-num">${SP.pts}</div><div class="muted">points in ${SP.len<120?SP.len+" s":SP.len/60+" min"}</div>
   <div class="muted" style="margin-top:6px">${SP.right} right · ${SP.wrong} wrong · ${SP.skips} skipped${n?" · "+Math.round(SP.right/n*100)+"% accuracy":""}</div>
   ${pb&&prev>0?`<div style="margin-top:10px;font-weight:900;color:var(--lime);font-size:20px">🏆 New best (was ${prev})</div>`:`<div class="small muted" style="margin-top:8px">Best: ${Math.max(prev,SP.pts)} points</div>`}</div>
   ${miss.length?`<div class="card"><h3>Review your misses</h3><div class="list">${miss.slice(0,12).map(r=>`<div class="topic" style="display:block"><div class="row" style="margin-bottom:6px">${subjTag(r.q.s)}<span class="small muted">${esc(topicOf(r.q).name)}</span></div><div>${tex(r.q.q)}</div><div class="small" style="margin-top:6px">Answer: <b>${tex(r.q.o[r.q.a])}</b></div><div class="small muted" style="margin-top:4px">${tex(r.q.x||"")}</div></div>`).join("")}</div></div>`:""}
   <div class="row"><button class="btn go" data-act="spGo">Go again</button><button class="btn" data-act="home">Home</button></div></div>`,"sprintend");
}

/* ---------- phones: typing view and ?debug=1 (FNF_Phone_Games_Guide.md, rules 1-3 and the real-phone check) ---------- */
/* While a text box has focus and an on-screen keyboard has shrunk the visible area, the page switches to a typing view
   (header and footer folded away, see the CSS) and scrolls the box's label to the top, so the question being answered
   and the box are on screen together. Laptops never shrink the visible area, so they never see it.
   ?kb=<px> pretends a keyboard of that height is up: phone_audit.py uses it, as no emulator shows a real keyboard. */
const KB_SIM=+(new URLSearchParams(location.search).get("kb")||0);
function askOf(e){let n=e;if(n.parentElement&&n.parentElement.classList.contains("row"))n=n.parentElement;const p=n.previousElementSibling;return p&&p.tagName==="LABEL"?p:null;}
let FULL_H=innerHeight;
function fitPhone(){
  const vv=window.visualViewport,a=document.activeElement;
  const box=!!(a&&a.matches&&a.matches("input:not([type=checkbox]),textarea"));
  const vis=(vv?vv.height:innerHeight)-(box&&KB_SIM?KB_SIM:0);
  if(!box)FULL_H=innerHeight;document.documentElement.style.setProperty("--fullh",FULL_H+"px");const typing=box&&vis<FULL_H-120;
  const was=document.body.classList.contains("typing");
  document.body.classList.toggle("typing",typing);
  document.documentElement.style.setProperty("--vvh",vis+"px");
  if(typing&&!was)(askOf(a)||a).scrollIntoView({block:"start"});
  dbgShow();
}
if(window.visualViewport){visualViewport.addEventListener("resize",fitPhone);visualViewport.addEventListener("scroll",fitPhone);}
document.addEventListener("focusin",fitPhone);document.addEventListener("focusout",()=>setTimeout(fitPhone,50));
/* ?debug=1: the numbers to read off a real phone with the keyboard up (screenshot it and send it back) */
const DBG=/[?&]debug=1(?![0-9])/.test(location.search);
function dbgShow(){
  if(!DBG)return;let d=$("#dbg");if(!d){d=document.createElement("div");d.id="dbg";document.body.appendChild(d);const p=document.createElement("div");p.id="sai";document.body.appendChild(p);}
  const vv=window.visualViewport,cs=getComputedStyle($("#sai"));
  d.textContent=`Rep Max v${VERSION} ${PROFILE||""}\ninner ${innerWidth}x${innerHeight}\nvisual ${vv?Math.round(vv.width)+"x"+Math.round(vv.height)+" top "+Math.round(vv.offsetTop):"n/a"}\nsafe ${["Top","Right","Bottom","Left"].map(k=>parseInt(cs["padding"+k])||0).join(" ")}\ndpr ${devicePixelRatio}  typing ${document.body.classList.contains("typing")?"on":"off"}`;
}
if(DBG){window.addEventListener("resize",dbgShow);setInterval(dbgShow,1000);}

/* ---------- start ---------- */
function route(){
  const m=(location.hash||"").match(/^#join-([A-Za-z]{4})(?:-(?:gcse|alevel))?$/);
  if(m){history.replaceState(null,"",location.pathname+location.search);ACT.join({code:m[1].toUpperCase()});return;}
  home();
}
let READY=false;   // a join link opened while the questions are still loading is handled once they are in
window.addEventListener("hashchange",()=>{if(READY)route();});
loadAll().catch(e=>console.error(e)).then(()=>{READY=true;route();});
</script>
