<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rep Max · A-level gym</title>
<meta name="theme-color" content="#0d0f13">
<meta name="description" content="Rep Max: a revision game for A-level Maths, Further Maths, Chemistry and Computer Science. Solo training, a daily challenge and live quiz nights with friends.">
<link rel="stylesheet" href="lib/katex.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'">

<style>
:root{--bg:#0d0f13;--panel:#161a21;--panel2:#1e232c;--line:#2b313d;--text:#f3f5f9;--mute:#9aa3b2;--lime:#c6ff3d;--lime2:#a5e400;--orange:#ff7a2f;--red:#ff4d5e;--green:#2fd27a;
--maths:#4da3ff;--further:#b27cff;--chem:#33d17a;--cs:#ff9f1c;--t0:#e5484d;--t1:#3e7bff;--t2:#e8a317;--t3:#2a9d5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#1b2230 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
a{color:var(--lime)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.wide .wrap{max-width:1100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font-weight:900;letter-spacing:.06em;font-size:26px;line-height:1;display:flex;align-items:center;gap:8px}
.logo b{color:var(--lime)}
.logo small{display:block;font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:700;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--lime);color:#111;border-color:var(--lime)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h2,.card h3{margin:0 0 8px}
h1{font-size:26px;margin:6px 0 4px;font-weight:900;letter-spacing:.01em}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:800}
.muted{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;width:auto;min-width:0}
.row>.tick+div{flex:1;min-width:0}
.top>.row{flex-wrap:nowrap}
.top .chip{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .08s,border-color .15s}
.big:hover{border-color:#3a4252}.big:active{transform:scale(.985)}
.big .em{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:14px;flex:none}
.big b{display:block;font-size:17px}.big span{color:var(--mute);font-size:13px}
.big.hero{background:linear-gradient(135deg,#25310c,#161a21 70%);border-color:#3f5414}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.btn.go{background:var(--lime);color:#111;border-color:var(--lime)}
.btn.go:hover{background:var(--lime2)}
.btn.warn{background:#3a1d22;border-color:#6b2a33;color:#ffb3bb}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.rank{display:flex;gap:14px;align-items:center}
.rank .badge{font-size:34px;width:58px;height:58px;border-radius:18px;background:var(--panel2);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime2),var(--lime));border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mute)}
.subj{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.subj i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lv{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:#2a2f18;color:var(--lime);border:1px solid #46521a}
.lv.l3{background:#3a1f12;color:#ffb184;border-color:#6b3518}
.qbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.qtext{font-size:19px;line-height:1.45;font-weight:600}
.wide .qtext{font-size:28px}
pre.code{background:#0a0c10;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;margin:12px 0 0;overflow-x:auto;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;counter-reset:ln}
.wide pre.code{font-size:20px}
pre.code span{display:block;padding-left:44px;position:relative;white-space:pre}
pre.code span::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:32px;text-align:right;color:#5b6475}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;padding:12px 14px;border-radius:14px;font-size:17px;font-weight:650;color:#fff;border:2px solid transparent;transition:transform .08s,opacity .2s}
.wide .opt{font-size:24px;min-height:90px}
.opt:active{transform:scale(.98)}
.opt .sh{font-size:20px;opacity:.9;flex:none;width:22px;text-align:center}
.opt.o0{background:var(--t0)}.opt.o1{background:var(--t1)}.opt.o2{background:var(--t2)}.opt.o3{background:var(--t3)}
.opt.dim{opacity:.28}
.opt.right{outline:4px solid var(--lime);outline-offset:2px;opacity:1}
.opt.mine{border-color:#fff}
.opt .mark{margin-left:auto;font-size:22px}
.opt .katex{color:#fff}
.feedback{margin-top:12px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:16px;line-height:1.45}
.feedback.ok{border-color:#2f6b24;background:#15230f}
.feedback.no{border-color:#6b2a33;background:#24121a}
.feedback b{font-size:18px}
.timer{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:6px 0 0}
.timer i{display:block;height:100%;background:var(--lime);width:100%;transition:width .2s linear}
.timer.low i{background:var(--red)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.combo{font-weight:900;color:var(--orange)}
.list{display:flex;flex-direction:column;gap:8px}
.topic{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.topic .nm{flex:1;min-width:0}
.topic .nm b{display:block;font-size:14px;font-weight:700}
.topic .nm span{font-size:12px;color:var(--mute)}
.mini{width:80px;height:8px;border-radius:99px;background:#0f1218;overflow:hidden;flex:none}
.mini i{display:block;height:100%}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid #485164;display:grid;place-items:center;flex:none;font-size:15px;font-weight:900}
.tick.on{background:var(--lime);border-color:var(--lime);color:#111}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
summary{padding:14px 16px;cursor:pointer;font-weight:800;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
details .inner{padding:0 12px 12px}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.brow.me{border-color:var(--lime)}
.brow .pos{width:26px;text-align:center;font-weight:900;color:var(--mute)}
.brow .av{font-size:22px}
.brow .pts{margin-left:auto;font-variant-numeric:tabular-nums}
.wide .brow{font-size:22px;padding:14px 18px}
.code-big{font-size:56px;font-weight:900;letter-spacing:.18em;color:var(--lime);font-variant-numeric:tabular-nums}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.av-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-size:22px}
.av-btn.sel{border-color:var(--lime)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20262f;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}
.pop{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:var(--lime);text-shadow:0 4px 24px #000;pointer-events:none;animation:pop 1s ease-out forwards;z-index:40}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.big-num{font-size:44px;font-weight:900;color:var(--lime);line-height:1}
.grid-emoji{font-size:22px;letter-spacing:1px;white-space:nowrap}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#262c37;color:var(--mute)}
.tex-raw{font-family:ui-monospace,Menlo,monospace;font-size:.9em;opacity:.9}
.katex{font-size:1.08em}
.err{color:#ffb3bb}
.qr{background:#fff;padding:10px;border-radius:14px;display:inline-block}
.qr img,.qr canvas{display:block}
.hostq .qtext{font-size:30px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.counts div{border-radius:10px;padding:8px;text-align:center;font-weight:900;color:#fff}
.hr{height:1px;background:var(--line);margin:14px 0}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.center{text-align:center}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--green)}
.status-dot.off{background:var(--red)}
.linkb{text-decoration:underline;color:var(--mute);font-size:13px;padding:2px 0}
.keycard{margin-top:10px;padding:12px 14px;border-radius:14px;background:#161d10;border:1px solid #3f5414;font-size:15px;line-height:1.45}
.foot{margin-top:28px;color:var(--mute);font-size:12px;text-align:center;line-height:1.6}
.topic:has(>.desc){flex-wrap:wrap}
.topic>.desc{flex-basis:100%;font-size:13px;color:#c9d1dc;line-height:1.4;margin:-4px 0 0;padding-left:42px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="muted">Loading Rep Max…</p></div></div>
<canvas id="confetti"></canvas>
<script>
/* data/<profile>/spec.js calls RM.setSpec, data/<profile>/generators.js calls RM.gen; the questions are in data/<profile>/*.jsonl */
window.RM={banks:{},spec:null,gens:[],profile:null,add(s,qs){(this.banks[s]=this.banks[s]||[]).push(...qs);},setSpec(x){this.spec=x;},gen(g){this.gens.push(g);}};
</script>
<!--rm-loader-start-->
<script>
/* Which course: ?p=alevel or ?p=gcse in the address (and remembered), else the one chosen before on this device.
   A quiz-night join link always opens the A-level side, where quiz nights are, without changing the saved choice. No course yet:
   nothing is loaded and the start screen asks. bundle.py replaces this block with the data inlined. */
(function(){
  var OK=["alevel","gcse"],m=location.search.match(/[?&]p=(alevel|gcse)(?![A-Za-z])/),p=m?m[1]:null;
  if(p){try{localStorage.setItem("rm_profile",JSON.stringify(p));}catch(e){}}
  else{try{p=JSON.parse(localStorage.getItem("rm_profile"));}catch(e){p=null;}}
  if(OK.indexOf(p)<0)p=null;
  if(/^#join-/.test(location.hash))p="alevel";   // quiz nights are A-level for now; a GCSE device joins without switching for good
  window.RM.profile=p;
  if(p)document.write('<script src="data/'+p+'/spec.js"><\/script><script src="data/'+p+'/generators.js"><\/script>');
})();
</script>
<!--rm-loader-end-->
<script src="lib/katex.min.js" defer onload="window.dispatchEvent(new Event('katex-ready'))" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';s.onload=function(){window.dispatchEvent(new Event('katex-ready'))};document.head.appendChild(s)"></script>
<script>
"use strict";
/* =====================================================================
   REP MAX — a revision gym for A-level and GCSE.
   Course map · Solo gym · Daily challenge · Live quiz night · Question maker (quizzes: A-level so far)
   Everything runs in the browser. Progress is saved on this device only.
   Live games travel through public MQTT relays (no accounts): use nicknames.
   ===================================================================== */
const VERSION="1.3.1";
const LAUNCH="2026-11-14";                 // daily challenge #1
/* The two courses. quiz:false = course map and tracker only (no questions written yet). */
const PROFILES={
  alevel:{label:"A-level",tag:"A-LEVEL GYM",quiz:true,subj:{
    maths:  {name:"Maths",short:"Maths",col:"var(--maths)",em:"∑"},
    further:{name:"Further Maths",short:"Further",col:"var(--further)",em:"∫"},
    chem:   {name:"Chemistry",short:"Chem",col:"var(--chem)",em:"⚗️"},
    cs:     {name:"Computer Science",short:"CS",col:"var(--cs)",em:"💻"}}},
  gcse:{label:"GCSE",tag:"GCSE",quiz:false,subj:{
    english_lang:{name:"English Language",short:"Eng Lang",col:"#e6a23c",em:"📖"},
    english_lit: {name:"English Literature",short:"Eng Lit",col:"#d97757",em:"🎭"},
    maths:       {name:"Maths",short:"Maths",col:"var(--maths)",em:"∑"},
    biology:     {name:"Biology",short:"Bio",col:"#33d17a",em:"🧬"},
    chemistry:   {name:"Chemistry",short:"Chem",col:"var(--chem)",em:"⚗️"},
    physics:     {name:"Physics",short:"Phys",col:"#4da3ff",em:"⚛️"},
    rs:          {name:"Religious Studies",short:"RS",col:"#b27cff",em:"🕊️"},
    history:     {name:"History",short:"History",col:"#c9a227",em:"🏰"},
    dt:          {name:"Design and Technology",short:"DT",col:"#ff7a2f",em:"🛠️"},
    business:    {name:"Business",short:"Business",col:"#5bc0be",em:"💼"}}}
};
const PROFILE=window.RM.profile;                     // null until a course is chosen
const PRO=PROFILES[PROFILE]||{label:"",tag:"",quiz:false,subj:{}};
const SUBJ=PRO.subj;
const SKEYS=Object.keys(SUBJ);
const LVNAME={1:"Warm-up",2:"Working set",3:"1-rep max"};
const XP_LV={1:10,2:20,3:40};
const RANKS=[[0,"Day One"],[150,"Starter"],[400,"Regular"],[900,"Lifter"],[1800,"Spotter"],[3200,"PB Hunter"],[5200,"Top Set"],[8000,"Plate Loaded"],[12000,"Rep Max"]];
const SHAPES=["▲","◆","●","■"];
const BADGES=["⚡","🚀","🧪","💻","🧮","🧠","🎧","🐉","👑","🎯","🛰️","🔭","⚙️","🧲","🪐","♟️","🎲","🌀","🔷","⭐"];
const NAME_A=["Cobalt","Argon","Scalar","Prime","Binary","Quantum","Cosmic","Rapid","Atomic","Electric","Static","Lateral","Null","Vector","Turbo","Iron"];
const NAME_B=["Heron","Otter","Falcon","Lynx","Kestrel","Badger","Pike","Raven","Tangent","Matrix","Proton","Pointer","Photon","Isotope","Radian","Buffer"];

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LS_PFX=PROFILE==="gcse"?"rm_gcse_":"rm_";   // each course keeps its own progress on a shared device
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS_PFX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(LS_PFX+k):localStorage.setItem(LS_PFX+k,JSON.stringify(v));}catch(e){}};
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function londonDate(d=new Date()){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);}catch(e){return d.toISOString().slice(0,10);}}
function dayDiff(a,b){return Math.round((Date.parse(b+"T12:00:00Z")-Date.parse(a+"T12:00:00Z"))/864e5);}
function addDays(d,n){const t=new Date(Date.parse(d+"T12:00:00Z")+n*864e5);return t.toISOString().slice(0,10);}
const fmt=n=>Number(n||0).toLocaleString("en-GB");
function randName(){return (pick(NAME_A)+" "+pick(NAME_B)).slice(0,22);}

/* ---------- maths rendering: text with $...$ segments ---------- */
function tex(s){
  const parts=String(s??"").split(/(\$[^$]+\$)/g);
  return parts.map(p=>{
    if(p.length>2&&p[0]==="$"&&p[p.length-1]==="$"){
      const t=p.slice(1,-1);
      if(window.katex){try{return katex.renderToString(t,{throwOnError:false,output:"html"});}catch(e){}}
      return '<span class="tex-raw" data-tex="'+esc(t)+'">'+esc(t)+'</span>';
    }
    return esc(p);
  }).join("");
}
window.addEventListener("katex-ready",()=>{document.querySelectorAll(".tex-raw").forEach(el=>{try{el.outerHTML=katex.renderToString(el.dataset.tex,{throwOnError:false,output:"html"});}catch(e){}});});
function codeHtml(c){if(!c)return"";return '<pre class="code">'+String(c).replace(/\t/g,"    ").split("\n").map(l=>"<span>"+(esc(l)||" ")+"</span>").join("")+"</pre>";}

/* ---------- the question bank ----------
   Questions live in data/<subject>.jsonl, one JSON object per line, so one bad
   line is skipped instead of breaking the subject. data/generators.js holds the
   number generators: each makes a fresh version of a calculation every time. */
const SPEC=window.RM.spec||{};
const TOPIC={};            // "subject|id" -> {id,name,year,s,group}
for(const s of SKEYS){for(const g of ((SPEC[s]||{}).groups||[])){for(const t of g.topics){TOPIC[s+"|"+t.id]={...t,s,group:g.name};}}}
const BANK=[],BAD=[],BYID={},CARDS={},LOAD_ERR=[];
function validQ(q){
  if(!q||typeof q.id!=="string"||!SUBJ[q.s]||![1,2,3].includes(q.lv))return false;
  if(q.gen)return typeof q.make==="function";
  return typeof q.q==="string"&&Array.isArray(q.o)&&q.o.length===4&&new Set(q.o).size===4&&Number.isInteger(q.a)&&q.a>=0&&q.a<4;
}
function addQ(q,where){if(validQ(q)&&!BYID[q.id]){BANK.push(q);BYID[q.id]=q;}else BAD.push(where);}
async function readData(name){
  const el=document.getElementById("rm-data-"+PROFILE+"-"+name);if(el)return el.textContent;
  const r=await fetch("data/"+PROFILE+"/"+name+".jsonl",{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);return r.text();
}
function parseLines(name,text){
  const out=[];
  String(text).split(/\r?\n/).forEach((line,i)=>{const l=line.trim();if(!l||l.startsWith("//"))return;try{out.push(JSON.parse(l.replace(/,\s*$/,"")));}catch(e){BAD.push(name+".jsonl line "+(i+1));}});
  return out;
}
async function loadAll(){

  try{for(const c of parseLines("cards",await readData("cards")))if(c&&SUBJ[c.s]&&c.t&&c.key)CARDS[c.s+"|"+c.t]=c;}catch(e){}

/* a generator makes a fresh version each time; a fixed question comes back as it is */
function inst(q,rnd){
  if(!q||!q.gen)return q;
  for(let k=0;k<5;k++){
    try{const r=q.make(rnd||Math.random);
      if(r&&typeof r.q==="string"&&Array.isArray(r.o)&&r.o.length===4&&new Set(r.o).size===4&&r.a>=0&&r.a<4)
        return{q:r.q,code:r.code||"",o:r.o.map(String),a:r.a,x:r.x||"",id:q.id,s:q.s,t:q.t,lv:q.lv,gen:true};
    }catch(e){}
  }
  return null;
}

function tone(f,dur,type="sine",vol=.2,when=0,slide=null){if(MUTED)return;const c=ac();if(!c)return;const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);}

function mergeProgress(o){

  for(const [k,v] of Object.entries(s.best||{}))ST.best[k]=Math.max(ST.best[k]||0,v);
  for(const [d,v] of Object.entries(s.daily||{}))if(!ST.daily[d])ST.daily[d]=v;

function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));return Promise.resolve(fallbackCopy(t));}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}a.remove();}

/* =====================================================================
   SOLO GYM
   ===================================================================== */
const WORKOUTS={
  quick:{name:"Quick 5",em:"⏱️",desc:"Levels 1–2 · 5 reps",n:5,lv:[1,2]},
  warm:{name:"Warm-up",em:"🤸",desc:"Level 1 · 10 reps",n:10,lv:[1]},
  sets:{name:"Working sets",em:"🏋️",desc:"Levels 1–2 · 10 reps",n:10,lv:[1,2]},
  max:{name:"1-rep max",em:"🔥",desc:"Hardest only · 5 reps",n:5,lv:[3]},
  weak:{name:"Weak spots",em:"🎯",desc:"Your misses and reviews due · 10 reps",n:10,lv:[1,2,3]}
};
let GYM=Object.assign({s:"mix",w:"sets",clock:false,taught:false,topic:null},lsGet("gym",{}));
if(!WORKOUTS[GYM.w])GYM.w="sets";
ACT.gym=()=>gymSetup();
function gymSetup(){
  setWide(false);
  const sChips=["mix",...SKEYS].map(s=>`<button class="chip ${GYM.s===s?"on":""}" data-act="gS" data-s="${s}">${s==="mix"?"🎲 Mixed":esc(SUBJ[s].em+" "+SUBJ[s].name)}</button>`).join("");
  const wBtns=Object.entries(WORKOUTS).map(([k,w])=>`<button class="big" data-act="gW" data-w="${k}" style="${GYM.w===k?"border-color:var(--lime)":""}"><span class="em">${w.em}</span><span><b>${w.name}</b><span>${w.desc}</span></span></button>`).join("");
  const tp=GYM.topic&&TOPIC[GYM.topic];
  render(`<div class="wrap">${topBar("Solo gym")}
  <div class="card"><h3>Subject</h3><div class="pchips">${sChips}</div>
  ${tp?`<div class="row" style="margin-top:12px"><span class="chip on">Topic: ${esc(tp.name)}</span><button class="small" style="text-decoration:underline" data-act="gClearT">clear</button></div>`:""}</div>
  <div class="grid2">${wBtns}</div>
  <div class="card"><div class="row"><button class="tick ${GYM.clock?"on":""}" data-act="gClock" aria-label="Beat the clock">${GYM.clock?"✓":""}</button><div><b>Beat the clock</b><div class="small muted">30 s a rep (60 s for 1-rep max), bonus XP for speed</div></div></div>
  ${coverRow("gTaught",GYM.taught,"gym")}</div>
  <button class="btn go block" data-act="gStart" style="font-size:18px;padding:16px">Start workout</button>
  <p class="small muted center" id="gmsg"></p></div>`,"gym");
}
ACT.gS=d=>{GYM.s=d.s;if(GYM.topic&&!GYM.topic.startsWith(d.s+"|"))GYM.topic=null;lsSet("gym",GYM);gymSetup();};
ACT.gW=d=>{GYM.w=d.w;lsSet("gym",GYM);gymSetup();};
ACT.gClock=()=>{GYM.clock=!GYM.clock;lsSet("gym",GYM);gymSetup();};
ACT.gTaught=()=>{GYM.taught=!GYM.taught;lsSet("gym",GYM);gymSetup();};
ACT.gClearT=()=>{GYM.topic=null;lsSet("gym",GYM);gymSetup();};
ACT.gStart=()=>{
  const w=WORKOUTS[GYM.w];
  let pool=BANK.filter(q=>(GYM.s==="mix"||q.s===GYM.s));
  if(GYM.topic)pool=pool.filter(q=>keyOf(q)===GYM.topic);   // one topic chosen in the tracker: ask it whatever the ticks say
  else pool=playable(pool,GYM.taught);
  let qs;
  if(GYM.topic){
    const rank=q=>(ST.q[q.id]?2:0)+(q.gen?0:1);
    qs=shuffle(pool).sort((a,b)=>rank(a)-rank(b)||((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0)).slice(0,w.n);
    const gens=pool.filter(q=>q.gen);for(let k=0;qs.length<w.n&&gens.length;k++)qs.push(gens[k%gens.length]);
  }else if(GYM.w==="weak"){
    const seen=pool.filter(q=>ST.q[q.id]);
    const weak=seen.filter(q=>ST.q[q.id].box===0||isDue(ST.q[q.id])).sort((a,b)=>ST.q[a.id].box-ST.q[b.id].box||ST.q[a.id].last-ST.q[b.id].last);
    const fresh=shuffle(pool.filter(q=>!ST.q[q.id]));
    qs=[...weak,...fresh].slice(0,w.n);
  }else{
    let p=pool.filter(q=>w.lv.includes(q.lv));
    p=shuffle(p).sort((a,b)=>((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0));   // least recently seen first
    qs=shuffle(p.slice(0,Math.max(w.n,Math.min(p.length,w.n*2)))).slice(0,w.n);
  }
  qs=qs.map(q=>inst(q)).filter(Boolean);
  if(!qs.length){$("#gmsg").textContent="No questions match those settings yet. Try another subject or workout, or check what you've covered.";return;}
  const label=w.name+" · "+(GYM.topic?TOPIC[GYM.topic].name:GYM.s==="mix"?"Mixed":SUBJ[GYM.s].name);
  startRun({mode:"gym",qs,label,clock:GYM.clock,key:GYM.w+"|"+(GYM.topic||GYM.s)});
};

/* =====================================================================
   THE RUNNER (solo gym + daily challenge)
   ===================================================================== */
let RUN=null,RT=null;
function startRun(o){
  const rnd=o.seed!=null?mulberry32(o.seed):Math.random;
  RUN={...o,i:0,res:[],combo:0,best:0,xp:0,score:0,perms:o.qs.map(()=>shuffle([0,1,2,3],rnd)),t0:Date.now()};
  showQ();
}
function qDur(q){return RUN.mode==="daily"?(q.lv===3?75:45):(q.lv===3?60:30);}
function showQ(){
  clearInterval(RT);
  const q=RUN.qs[RUN.i],perm=RUN.perms[RUN.i],tp=topicOf(q);
  RUN.locked=false;RUN.start=Date.now();
  const timed=!!RUN.clock;
  render(`<div class="wrap">
  <div class="top"><button class="icon-btn" data-act="quitRun" aria-label="Quit">✕</button>
   <div class="hud"><span class="chip">${RUN.mode==="daily"?"Daily · ":""}Rep ${RUN.i+1}/${RUN.qs.length}</span>${RUN.combo>=2?`<span class="combo">🔥 x${RUN.combo}</span>`:""}</div>
   <button class="icon-btn" data-act="mute" aria-label="Sound">${MUTED?"🔇":"🔊"}</button></div>
  ${timed?`<div class="timer" id="tm"><i></i></div>`:""}
  <div class="qbox"><div class="row" style="margin-bottom:10px">${subjTag(q.s)}${lvTag(q.lv)}<span class="small muted">${esc(tp.name)}</span></div>
   <div class="qtext">${tex(q.q)}</div>${codeHtml(q.code)}
   <div class="opts">${perm.map((k,i)=>`<button class="opt o${i}" data-act="pickOpt" data-i="${i}" data-silent="1"><span class="sh">${SHAPES[i]}</span><span>${tex(q.o[k])}</span></button>`).join("")}</div>
   <div id="fb"></div>
   <div class="small muted" style="margin-top:12px">${esc(specRef(q))} · <span class="tag">${esc(q.id)}${q.gen?" · new numbers each time":""}</span></div></div></div>`,"run");
  if(timed){
    const dur=qDur(q)*1000;
    RT=setInterval(()=>{const left=dur-(Date.now()-RUN.start);const el=$("#tm");if(!el){clearInterval(RT);return;}el.querySelector("i").style.width=Math.max(0,left/dur*100)+"%";el.classList.toggle("low",left<dur*.25);if(left<=0){clearInterval(RT);answer(-1);}},200);
  }
}
ACT.pickOpt=d=>answer(+d.i);
function answer(di){
  if(!RUN||RUN.locked)return;RUN.locked=true;clearInterval(RT);
  const q=RUN.qs[RUN.i],perm=RUN.perms[RUN.i],right=perm.indexOf(q.a),ok=di===right;
  const secs=(Date.now()-RUN.start)/1000,dur=qDur(q);
  recordAnswer(q,ok);
  let xp=0,pts=0;
  if(ok){RUN.combo++;RUN.best=Math.max(RUN.best,RUN.combo);xp=XP_LV[q.lv];pts=100;if(RUN.clock){const f=Math.max(0,1-secs/dur);xp+=Math.round(xp*.5*f);pts+=Math.round(50*f);}if(RUN.combo>=3)xp+=5;}
  else RUN.combo=0;
  RUN.xp+=xp;RUN.score+=pts;
  RUN.res.push({id:q.id,ok,di,secs,timeout:di<0});
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===right){b.classList.add("right");b.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>');}else b.classList.add("dim");if(i===di&&!ok){b.classList.add("mine");b.insertAdjacentHTML("beforeend",'<span class="mark">✗</span>');}});
  if(ok){SFX.correct();if(RUN.combo>=3)SFX.combo();popText("+"+xp+" XP");}else SFX.wrong();
  const last=RUN.i===RUN.qs.length-1,card=CARDS[keyOf(q)];
  const head=ok?(RUN.combo>=3?"🔥 Combo x"+RUN.combo:pick(["Clean rep.","Nailed it.","Strong.","Lift complete."])):di<0?"Out of time.":pick(["Not this one.","Missed."]);
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><b>${head}</b><div style="margin-top:6px">${tex(q.x||"")}</div></div>
   ${card&&!ok?cardHtml(card):""}<div id="cardBox"></div>
   <div class="row small" style="margin-top:10px;gap:16px">${card&&ok?`<button class="linkb" data-act="showCard" data-k="${esc(keyOf(q))}">Key idea</button>`:""}<button class="linkb" data-act="notYet" data-k="${esc(keyOf(q))}">Not done this topic yet</button><button class="linkb" data-act="report" data-i="${RUN.i}">Report a problem</button></div>
   <button class="btn go block" style="margin-top:12px" data-act="nextQ">${last?"Finish":"Next rep →"}</button>`;
  setTimeout(()=>{const b=document.querySelector("[data-act=nextQ]");if(b)b.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
}
ACT.showCard=d=>{const el=$("#cardBox");if(el)el.innerHTML=el.innerHTML?"":cardHtml(CARDS[d.k]);};
ACT.notYet=(d,b)=>{const was=markNotYet(d.k),t=TOPIC[d.k];
  if(RUN&&!RUN.done){const keep=RUN.qs.map((q,i)=>i<=RUN.i||keyOf(q)!==d.k);RUN.qs=RUN.qs.filter((q,i)=>keep[i]);RUN.perms=RUN.perms.filter((p,i)=>keep[i]);}
  if(b){b.textContent="Undo";b.dataset.act="undoNotYet";b.dataset.was=was?"1":"";}
  toast(`"${t?t.name:"That topic"}" is out of your quizzes until you tick it in the Course map.`,3600);};
ACT.undoNotYet=(d,b)=>{delete NOTYET[d.k];lsSet("notyet",NOTYET);if(d.was){TAUGHT[d.k]=true;lsSet("taught",TAUGHT);}if(b){b.textContent="Not done this topic yet";b.dataset.act="notYet";}toast("Undone");};
ACT.report=d=>{const i=d.i!=null?+d.i:RUN&&RUN.i,q=RUN&&RUN.qs[i];if(!q)return;copyText(reportText(q,RUN.perms[i])).then(()=>toast("Copied. Paste it into a message, or fix the line on GitHub.",3600));};
ACT.nextQ=()=>{if(!RUN)return;RUN.i++;if(RUN.i>=RUN.qs.length)endRun();else showQ();};
ACT.quitRun=()=>{clearInterval(RT);RUN=null;home();};   // nothing is recorded for an unfinished daily challenge
function endRun(){
  clearInterval(RT);
  const right=RUN.res.filter(r=>r.ok).length,n=RUN.qs.length,daily=RUN.mode==="daily";
  let pb=false;
  if(RUN.mode==="gym"){
    const prev=ST.best[RUN.key]||0;const val=right*1000+Math.max(0,999-Math.round(RUN.res.reduce((a,r)=>a+(r.secs||0),0)));
    if(val>prev&&right>0){ST.best[RUN.key]=val;pb=prev>0;}saveST();
  }
  if(daily&&!RUN.practice){
    const grid=RUN.res.map(r=>r.ok?"🟩":r.timeout?"⬛":"🟥").join("");
    ST.daily[RUN.date]={right,n,grid,score:RUN.score,clock:!!RUN.clock};saveST();
    RUN.xp+=20;
  }
  addXP(RUN.xp);
  if(pb||right===n){SFX.fanfare();confetti();}
  const missed=RUN.res.map((r,i)=>r.ok?null:i).filter(i=>i!=null);
  render(`<div class="wrap">${topBar(daily?"Daily challenge":"Workout done")}
   <div class="card center"><div class="big-num">${right}/${n}</div>
   <div class="muted" style="margin-top:6px">+${fmt(RUN.xp)} XP · best combo ${RUN.best}${daily&&RUN.clock?" · "+fmt(RUN.score)+" pts against the clock":""}</div>
   ${pb?`<div style="margin-top:10px;font-weight:900;color:var(--lime);font-size:20px">🏆 New PB</div>`:right===n?`<div style="margin-top:10px;font-weight:900;color:var(--lime);font-size:20px">💯 Perfect set</div>`:""}
   ${daily&&!RUN.practice?`<div class="grid-emoji" style="margin-top:12px">${ST.daily[RUN.date].grid}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn go" data-act="shareDaily">Share result</button></div>`:""}
   </div>
   ${missed.length?`<div class="card"><h3>Review your misses</h3><div class="list">${missed.map(i=>{const q=RUN.qs[i],c=CARDS[keyOf(q)];return `<div class="topic" style="display:block"><div class="row" style="margin-bottom:6px">${subjTag(q.s)}<span class="small muted">${esc(topicOf(q).name)}</span></div><div>${tex(q.q)}</div>${codeHtml(q.code)}<div style="margin-top:8px"><b style="color:var(--lime)">Answer:</b> ${tex(q.o[q.a])}</div><div class="small muted" style="margin-top:4px">${tex(q.x||"")}</div>${c?`<div class="small" style="margin-top:6px"><b>Key idea:</b> ${tex(c.key)}</div>`:""}<div style="margin-top:6px"><button class="linkb" data-act="report" data-i="${i}">Report a problem</button></div></div>`;}).join("")}</div></div>`:""}
   <div class="row">${daily?"":`<button class="btn go" data-act="again">Go again</button>`}<button class="btn" data-act="home">Home</button></div></div>`,"end");
  RUN.done=true;
}
ACT.again=()=>{if(RUN&&RUN.mode==="gym")ACT.gStart();};

/* =====================================================================
   DAILY CHALLENGE — 10 questions from what you've covered. Friends on the
   same courses who have ticked the same topics get the same 10.
   ===================================================================== */
let DCLOCK=lsGet("dclock",false);
function dailySet(date){
  const rnd=mulberry32(hashStr("repmax-daily-"+date));
  const pool=playable(BANK,true);
  const subs=SKEYS.filter(s=>pool.some(q=>q.s===s&&q.lv<=2));
  const lists=Object.fromEntries(subs.map(s=>[s,shuffle(pool.filter(q=>q.s===s&&q.lv<=2),rnd)]));
  const chosen=[];let k=0;
  while(chosen.length<8&&subs.some(s=>lists[s].length)){const s=subs[k++%subs.length];if(lists[s].length)chosen.push(lists[s].shift());}
  const hard=shuffle(pool.filter(q=>q.lv===3&&!chosen.includes(q)),rnd).slice(0,2);
  let qs=[...shuffle(chosen,rnd),...hard];
  if(qs.length<10)qs=qs.concat(shuffle(pool.filter(q=>!qs.includes(q)),rnd).slice(0,10-qs.length));
  return qs.slice(0,10).map(q=>inst(q,mulberry32(hashStr(date+"|"+q.id)))).filter(Boolean);
}
ACT.daily=()=>{
  setWide(false);
  const d=londonDate(),dn=Math.max(1,dayDiff(LAUNCH,d)+1),done=ST.daily[d];
  if(done){
    render(`<div class="wrap">${topBar("Daily challenge #"+dn)}
     <div class="card center"><div class="muted">Today</div><div class="big-num" style="margin-top:6px">${done.right}/${done.n||10}</div><div class="grid-emoji" style="margin-top:10px">${done.grid}</div>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn go" data-act="shareDaily">Share result</button><button class="btn" data-act="dailyPractice">Practise today's set</button></div></div>
     <p class="muted small center">A new set unlocks at midnight (UK time).</p></div>`,"daily");
    return;
  }
  const c=covStats();
  render(`<div class="wrap">${topBar("Daily challenge #"+dn)}
   <div class="card"><h2>☀️ Today's set</h2><p>${c.topics?`From the ${c.topics} topics you've covered.`:`From every topic. Set what you've covered to keep it to what you've had in class.`} Friends who have covered the same topics get the same 10.</p>
   <ul class="muted"><li>No clock, unless you switch it on</li><li>It only counts once you finish; quitting doesn't</li></ul>
   <div class="row" style="margin:10px 0 14px"><button class="tick ${DCLOCK?"on":""}" data-act="dClock" aria-label="Beat the clock">${DCLOCK?"✓":""}</button><div><b>Beat the clock</b><div class="small muted">45 s a question (75 for the last two), points for speed</div></div></div>
   <div class="row" style="margin-bottom:14px"><button class="btn" data-act="coverage" data-back="daily">📍 What I've covered</button></div>
   <button class="btn go block" data-act="dailyGo" style="font-size:18px;padding:16px">Start</button><p class="small muted center" id="dmsg"></p></div></div>`,"daily");
};
ACT.dClock=()=>{DCLOCK=!DCLOCK;lsSet("dclock",DCLOCK);ACT.daily();};
ACT.dailyGo=()=>{const d=londonDate(),qs=dailySet(d);if(!qs.length){$("#dmsg").textContent="No questions match what you've covered yet.";return;}startRun({mode:"daily",qs,date:d,seed:hashStr("perm-"+d),clock:DCLOCK,label:"Daily"});};
ACT.dailyPractice=()=>{const d=londonDate();startRun({mode:"daily",practice:true,qs:dailySet(d),date:d,seed:hashStr("perm-"+d),clock:false,label:"Daily practice"});};
ACT.shareDaily=()=>{
  const d=RUN&&RUN.date||londonDate(),r=ST.daily[d];if(!r)return;
  const dn=Math.max(1,dayDiff(LAUNCH,d)+1),url=location.origin+location.pathname;

};

/* =====================================================================
   SPEC TRACKER
   ===================================================================== */
let TRK=lsGet("trk",null);
ACT.tracker=()=>tracker();
function tracker(){
  setWide(false);
  if(!SUBJ[TRK])TRK=SKEYS[0];
  const s=TRK,sp=SPEC[s]||{groups:[]};
  const all=sp.groups.flatMap(g=>g.topics);
  const ms=all.map(t=>mastery(s,t.id)).filter(Boolean);
  const overall=ms.length?Math.round(ms.reduce((a,b)=>a+b.m,0)/ms.length*100):0;
  const col=x=>!x||x.n<3?"#56627a":x.m<.4?"var(--red)":x.m<.75?"var(--orange)":"var(--green)";
  const tabs=SKEYS.map(k=>`<button class="chip ${k===s?"on":""}" data-act="trkS" data-s="${k}">${esc(SUBJ[k].short)}</button>`).join("");
  let slot=0;
  const nDone=all.filter(t=>TAUGHT[s+"|"+t.id]).length;
  const meta=t=>[/^\d/.test(t.id)?esc(t.id):"",t.year?"Year "+esc(String(t.year).replace("-","–")):"",t.tier==="H"?"Higher only":"",t.option?(t.option===t.name?"Option":"Option: "+esc(t.option)):""].filter(Boolean).join(" · ");
  render(`<div class="wrap">${topBar("Course map")}
   <div class="row"><div class="pchips">${tabs}</div><span class="spacer"></span><button class="btn" style="padding:8px 12px" data-act="coverage" data-back="tracker">📍 What I've covered</button></div>
   <div class="card"><div class="row"><div><b style="font-size:18px">${esc(sp.name||SUBJ[s].name)}</b><div class="small muted">${esc(sp.board||"")} ${esc(sp.code||"")}</div></div><span class="spacer"></span><div class="center">${PRO.quiz?`<div class="big-num" style="font-size:30px">${overall}%</div><div class="small muted">strength</div>`:`<div class="big-num" style="font-size:30px">${nDone}/${all.length}</div><div class="small muted">covered</div>`}</div></div>
   <p class="small muted" style="margin:8px 0 0">${esc(sp.note||"")} Tick a topic once you've had it in class${PRO.quiz?"; workouts and quiz nights then stick to your ticks. Bars stay grey until you've answered a topic a few times.":"."}</p></div>
   ${sp.groups.map(g=>`<details ${g.topics.every(t=>String(t.year)==="13")?"":"open"}><summary>${esc(g.name)}<span class="spacer"></span><span class="small muted">${g.topics.length} topics</span></summary><div class="inner list">${g.topics.map(t=>{
     const m=mastery(s,t.id),qs=topicQs(s,t.id),nf=qs.filter(q=>!q.gen).length,ng=qs.length-nf,key=s+"|"+t.id,card=CARDS[key],id="slot"+(slot++);
     return `<div class="topic"><button class="tick ${TAUGHT[key]?"on":""}" data-act="taught" data-k="${esc(key)}" aria-label="Taught">${TAUGHT[key]?"✓":""}</button>
     <div class="nm"><b>${esc(t.name)}</b><span>${[meta(t),PRO.quiz?nf+" question"+(nf===1?"":"s")+(ng?` + ${ng} generator${ng===1?"":"s"}`:""):"",NOTYET[key]?"not done yet":""].filter(Boolean).join(" · ")}</span>${card?`<div><button class="linkb" data-act="trkCard" data-k="${esc(key)}" data-slot="${id}">Key idea</button></div>`:""}</div>
     ${PRO.quiz?`<div class="mini"><i style="width:${!m?0:Math.max(4,m.m*100)}%;background:${col(m)}"></i></div>
     ${qs.length?`<button class="btn" style="padding:8px 10px;font-size:13px" data-act="trainT" data-k="${esc(key)}">Train</button>`:`<span class="tag">soon</span>`}`:""}
     ${t.desc?`<div class="desc">${esc(t.desc)}</div>`:""}</div><div id="${id}"></div>`;}).join("")}</div></details>`).join("")}
  </div>`,"tracker");
}
ACT.trkS=d=>{TRK=d.s;lsSet("trk",TRK);tracker();};

/* =====================================================================
   LIVE QUIZ NIGHT
   Relay transport adapted from Nose Knows: messages go through every public
   MQTT broker that answers and are de-duplicated on arrival. No accounts.
   The host's screen is in charge: it picks questions, keeps the answer key,
   times each question and scores. Phones send only their pick.
   ===================================================================== */
const PEER_PREFIX="rep-max-v1-";
const MQTT_SRC=["lib/mqtt.min.js","https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js","https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"];
const BROKERS=[{url:"wss://public.cloud.shiftr.io:443/mqtt",username:"public",password:"public"},{url:"wss://broker.emqx.io:8084/mqtt"},{url:"wss://broker.hivemq.com:8884/mqtt"}];
const RELAY_ROOT="rm-relay-v1/";
const rid=(n=12)=>{const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";const r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):null;for(let i=0;i<n;i++)s+=a[(r?r[i]:Math.floor(Math.random()*256))%a.length];return s;};
class RelayEmitter{constructor(){this._h={};}on(e,f){(this._h[e]=this._h[e]||new Set()).add(f);return this;}off(e,f){if(this._h[e])this._h[e].delete(f);return this;}emit(e,...a){[...(this._h[e]||[])].forEach(f=>{try{f(...a);}catch(x){console.error(x);}});}}
class RelayConn extends RelayEmitter{
  constructor(peer,remote,cid){super();this._peer=peer;this.remote=remote;this.cid=cid;this.open=false;this.lastSeen=Date.now();}
  send(obj){if(!this.open)throw new Error("closed");this._peer._pub(this.remote,{t:"d",cid:this.cid,d:obj});}
  close(){if(this._dropped)return;try{this._peer._pub(this.remote,{t:"x",cid:this.cid});}catch(e){}this._drop();}
  _drop(){if(this._dropped)return;this._dropped=true;this.open=false;this._peer.conns.delete(this.cid);clearInterval(this._retry);this.emit("close");}
}
class RelayPeer extends RelayEmitter{
  constructor(id){super();this.claim=typeof id==="string";this.id=this.claim?id:"p-"+rid(14);this.destroyed=false;this.conns=new Map();this.clients=[];this.nonce=rid(10);this._seen=new Set();this._seenQ=[];this._open=false;this._taken=false;setTimeout(()=>this._start(),0);}
  get disconnected(){return !this.clients.some(c=>c.connected);}
  _topic(id){return RELAY_ROOT+id;}
  _start(){
    let first=true;
    const failT=setTimeout(()=>{if(first&&!this.destroyed)this.emit("error",{type:"network"});},12000);
    for(const b of BROKERS){
      let c;try{c=mqtt.connect(b.url,{clientId:"rm_"+rid(14),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30,...(b.username?{username:b.username,password:b.password}:{})});}catch(e){continue;}
      this.clients.push(c);
      c.on("connect",()=>{c.subscribe(this._topic(this.id),{qos:0},()=>{if(first&&!this.destroyed){first=false;clearTimeout(failT);this._ready();}});});
      c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString());}catch(e){return;}this._recv(m);});
      c.on("error",()=>{});
    }
    if(!this.clients.length){clearTimeout(failT);setTimeout(()=>this.emit("error",{type:"network"}));}
    this._hb=setInterval(()=>this._beat(),5000);
  }
  _ready(){
    if(!this.claim){this._open=true;this.emit("open",this.id);return;}
    try{this._pub(this.id,{t:"probe",n:this.nonce});}catch(e){}
    setTimeout(()=>{if(this.destroyed)return;if(this._taken){this.emit("error",{type:"unavailable-id"});this.destroy();return;}this._open=true;this.emit("open",this.id);},1800);
  }
  _pub(target,msg){const live=this.clients.filter(c=>c.connected);if(!live.length)throw new Error("offline");msg.from=this.id;msg.mid=rid(12);const s=JSON.stringify(msg),t=this._topic(target);live.forEach(c=>{try{c.publish(t,s,{qos:0});}catch(e){}});}
  _dup(mid){if(!mid)return false;if(this._seen.has(mid))return true;this._seen.add(mid);this._seenQ.push(mid);if(this._seenQ.length>4000)this._seen.delete(this._seenQ.shift());return false;}
  _recv(m){
    if(!m||typeof m!=="object"||this.destroyed||this._dup(m.mid))return;
    const c=m.cid&&this.conns.get(m.cid);
    switch(m.t){
      case "probe":if(m.n===this.nonce)return;if(this.claim&&this._open)try{this._pub(this.id,{t:"taken",n:m.n});}catch(e){}return;
      case "taken":if(m.n===this.nonce)this._taken=true;return;
      case "open":{
        if(!this._open||typeof m.from!=="string"||typeof m.cid!=="string")return;
        if(c){try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}return;}
        const conn=new RelayConn(this,m.from,m.cid);this.conns.set(m.cid,conn);this.emit("connection",conn);
        conn.open=true;try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}setTimeout(()=>conn.emit("open"));return;}
      case "ack":if(c&&!c.open&&c.remote===m.from){c.open=true;c.lastSeen=Date.now();clearInterval(c._retry);c.emit("open");}return;
      case "d":if(c&&c.remote===m.from){c.lastSeen=Date.now();if(c.open)c.emit("data",m.d);}else if(this.claim&&m.from)try{this._pub(m.from,{t:"x",cid:m.cid});}catch(e){}return;
      case "hb":if(c&&c.remote===m.from)c.lastSeen=Date.now();return;
      case "x":if(c&&c.remote===m.from)c._drop();return;
    }
  }
  _beat(){const now=Date.now();for(const c of [...this.conns.values()]){if(!c.open)continue;if(now-c.lastSeen>17000){c._drop();continue;}try{this._pub(c.remote,{t:"hb",cid:c.cid});}catch(e){}}}
  connect(target){
    const cid=rid(14),conn=new RelayConn(this,target,cid);this.conns.set(cid,conn);
    const ask=()=>{try{this._pub(target,{t:"open",cid});}catch(e){}};
    ask();conn._retry=setInterval(()=>{if(conn.open||conn._dropped)return clearInterval(conn._retry);ask();},1500);
    setTimeout(()=>{if(!conn.open&&!conn._dropped){clearInterval(conn._retry);this.conns.delete(cid);conn._dropped=true;conn.emit("fail");}},8000);
    return conn;
  }
  reconnect(){this.clients.forEach(c=>{if(!c.connected)try{c.reconnect();}catch(e){}});}
  destroy(){if(this.destroyed)return;this.destroyed=true;clearInterval(this._hb);[...this.conns.values()].forEach(c=>c.close());this.clients.forEach(c=>{try{c.end(true);}catch(e){}});}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadMqtt(){if(!window.mqtt){for(const s of MQTT_SRC){try{await loadScript(s);if(window.mqtt)break;}catch(e){}}}return !!window.mqtt;}
function peerOnce(id){
  return new Promise((res,rej)=>{
    let p;try{p=new RelayPeer(id);}catch(e){return rej({type:"init"});}
    const t=setTimeout(()=>{try{p.destroy();}catch(e){}rej({type:"timeout"});},14000);
    const onErr=e=>{clearTimeout(t);try{p.destroy();}catch(x){}rej({type:e&&e.type||"error"});};
    p.on("open",()=>{clearTimeout(t);p.off("error",onErr);res(p);});p.on("error",onErr);
  });
}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
const myPid=()=>{let p=lsGet("pid",null);if(!p){p="p"+rid(10);lsSet("pid",p);}return p;};

function ptsFor(ms,dur){return 800+Math.round(200*Math.max(0,1-ms/(dur*1000)));}

ACT.hostOpen=async()=>{
  if(!hostPool().length){$("#hmsg").textContent="No questions match those settings.";return;}
  $("#hmsg").textContent="Opening a room…";
  if(!(await loadMqtt())){$("#hmsg").textContent="Couldn't load the connection library. Check the internet connection.";return;}
  let peer=null,code=null;
  for(let i=0;i<8&&!peer;i++){code=genCode();try{peer=await peerOnce(PEER_PREFIX+code);}catch(e){if(e.type!=="unavailable-id"){$("#hmsg").textContent="Couldn't open a room ("+e.type+"). The network may block live connections: try another Wi-Fi or a phone hotspot.";return;}}}
  if(!peer){$("#hmsg").textContent="Couldn't get a free room code. Try again.";return;}
  H={peer,code,qs:hostDeal(),game:1,conns:new Map(),players:new Map(),phase:"lobby",i:-1,cur:null,answers:new Map(),autoT:null,qT:null,hostPid:"h-"+myPid()};
  if(HS.play)H.players.set(H.hostPid,{pid:H.hostPid,name:ME.name,badge:ME.badge,score:0,streak:0,host:true,online:true});
  peer.on("connection",conn=>{
    conn.on("data",m=>hostRecv(conn,m));
    conn.on("close",()=>{if(conn._pid&&H&&H.conns.get(conn._pid)===conn){H.conns.delete(conn._pid);const p=H.players.get(conn._pid);if(p)p.online=false;hostRefresh();}});
  });
  peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});
  H.syncT=setInterval(()=>{if(!H)return;for(const [pid,c] of H.conns)hsend(c,{...stateFor(pid),sync:1});},3000);   // relays can drop messages: re-send the current state
  keepAwake();
  hostRender();
};
function hostRecv(conn,m){
  if(!H||!m||typeof m!=="object")return;
  if(m.t==="hello"){
    const pid=String(m.pid||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);if(!pid)return;
    const name=String(m.name||"Player").replace(/[<>]/g,"").slice(0,22)||"Player",badge=String(m.badge||"⭐").slice(0,8);
    conn._pid=pid;const old=H.conns.get(pid);if(old&&old!==conn)try{old.close();}catch(e){}
    H.conns.set(pid,conn);
    const p=H.players.get(pid);
    if(p){p.name=name;p.badge=badge;p.online=true;}else H.players.set(pid,{pid,name,badge,score:0,streak:0,online:true});
    hsend(conn,stateFor(pid));hostRefresh();
    if(H.phase==="lobby")broadcast(lobbyMsg());
    return;
  }
  if(m.t==="ans")hostTakeAnswer(conn._pid,m.n,m.c);
}
function hostTakeAnswer(pid,n,c){
  if(!H||!pid||H.phase!=="q"||n!==H.i||H.answers.has(pid)||!H.players.has(pid))return;
  const ms=Date.now()-H.cur.start;if(ms>H.cur.dur*1000+GRACE)return;
  c=+c;if(!(c>=0&&c<4))return;
  H.answers.set(pid,{c,ms});
  const box=$("#hAns");if(box)box.textContent=H.answers.size+" / "+activeCount()+" answered";
  if(H.answers.size>=activeCount())setTimeout(()=>{if(H&&H.phase==="q"&&H.cur&&n===H.i)hostReveal();},400);
}
const activeCount=()=>[...H.players.values()].filter(p=>p.online||p.host).length;
const send=(c,o)=>{try{c.send(o);}catch(e){}};
const hsend=(c,o)=>send(c,{...o,g:H?H.game:0});
function broadcast(o){if(!H)return;for(const c of H.conns.values())hsend(c,o);}
function playerList(){return [...H.players.values()].map(p=>({pid:p.pid,name:p.name,badge:p.badge,online:!!(p.online||p.host)}));}
function boardList(){return [...H.players.values()].sort((a,b)=>b.score-a.score).map((p,i)=>({pid:p.pid,name:p.name,badge:p.badge,score:p.score,pos:i+1}));}
function lobbyMsg(){return{t:"lobby",players:playerList(),code:H.code,subs:HS.subs.map(s=>SUBJ[s].name),n:H.qs.length};}
function qMsg(){const q=H.cur.q;return{t:"q",n:H.i,total:H.qs.length,dur:H.cur.dur,left:Math.max(0,H.cur.dur*1000-(Date.now()-H.cur.start)),q:{s:q.s,t:topicOf(q).name,lv:q.lv,q:q.q,code:q.code||"",o:H.cur.perm.map(k=>q.o[k])}};}
function stateFor(pid){
  if(H.phase==="lobby")return lobbyMsg();
  if(H.phase==="q"){const m=qMsg();m.mine=H.answers.has(pid)?H.answers.get(pid).c:null;return m;}
  if(H.phase==="rev")return{...H.lastRev,you:H.lastRev.res[pid]||null};
  return{t:"end",board:boardList()};
}
function hostStart(){if(!H||H.phase!=="lobby"||!H.qs.length)return;hostQuestion(0);}
function hostQuestion(i){
  clearTimeout(H.autoT);clearInterval(H.qT);
  H.i=i;H.phase="q";H.answers=new Map();
  const q=H.qs[i];H.cur={q,perm:shuffle([0,1,2,3]),start:Date.now(),dur:HS.dur*(q.lv===3?2:1)};
  broadcast(qMsg());hostRender();SFX.plate();
  H.qT=setInterval(()=>{
    if(!H||H.phase!=="q")return clearInterval(H.qT);
    const left=H.cur.dur*1000-(Date.now()-H.cur.start),el=$("#tm");
    if(el){el.querySelector("i").style.width=Math.max(0,left/(H.cur.dur*1000)*100)+"%";el.classList.toggle("low",left<H.cur.dur*250);}
    const sec=$("#hSec");if(sec)sec.textContent=Math.max(0,Math.ceil(left/1000));
    if(left<=-GRACE){clearInterval(H.qT);hostReveal();}
  },200);
}
function hostReveal(){
  if(!H||H.phase!=="q")return;clearInterval(H.qT);
  const q=H.cur.q,right=H.cur.perm.indexOf(q.a),res={},counts=[0,0,0,0];
  for(const [pid,p] of H.players){
    const a=H.answers.get(pid);
    if(a)counts[a.c]++;
    if(a&&a.c===right){p.streak++;const pts=ptsFor(a.ms,H.cur.dur)+Math.min(150,(p.streak-1)*50);p.score+=pts;res[pid]={ok:true,pts,c:a.c,streak:p.streak};}
    else{p.streak=0;res[pid]={ok:false,pts:0,c:a?a.c:null};}
  }
  const board=boardList();board.forEach(b=>{if(res[b.pid])res[b.pid].pos=b.pos;});
  H.phase="rev";H.lastRev={t:"rev",n:H.i,total:H.qs.length,a:right,x:q.x||"",counts,res,board:board.slice(0,5),players:board.length,q:{q:q.q,code:q.code||"",o:H.cur.perm.map(k=>q.o[k])}};
  for(const [pid,c] of H.conns)hsend(c,{...H.lastRev,you:res[pid]||null});
  if(HS.play){const mine=res[H.hostPid];if(mine)recordAnswer(q,mine.ok);}
  hostRender();
  if(HS.auto)H.autoT=setTimeout(()=>{if(H&&H.phase==="rev")hostNext();},HS.auto*1000);
}
function hostNext(){if(!H)return;clearTimeout(H.autoT);if(H.i+1<H.qs.length)hostQuestion(H.i+1);else hostEnd();}
function hostEnd(){
  clearTimeout(H.autoT);clearInterval(H.qT);H.phase="end";
  broadcast({t:"end",board:boardList()});

  hostRender();SFX.fanfare();confetti();
}
ACT.hStart=()=>hostStart();
ACT.hNext=()=>hostNext();
ACT.hReveal=()=>hostReveal();
ACT.hEnd=()=>hostEnd();
ACT.hRematch=()=>{   // same room, same players, a fresh set of questions

ACT.hPick=d=>{if(!H||H.phase!=="q"||!HS.play)return;if(H.answers.has(H.hostPid))return;hostTakeAnswer(H.hostPid,H.i,+d.i);document.querySelectorAll(".hostq .opt").forEach(b=>{b.disabled=true;});const l=$("#hLock");if(l)l.textContent="🔒 Your answer is in";};
ACT.hCopy=()=>copyText(joinLink(H.code)).then(()=>toast("Join link copied"));

function hostRefresh(){if(!H)return;if(H.phase==="lobby")hostRender();else{const box=$("#hPlayers");if(box)box.innerHTML=playerChips();}}
function playerChips(){return [...H.players.values()].map(p=>`<span class="chip" style="${p.online||p.host?"":"opacity:.45"}">${esc(p.badge)} ${esc(p.name)}${p.host?" (host)":""}</span>`).join("")||`<span class="muted">Waiting for players…</span>`;}
function boardHtml(board,meId){return `<div class="board">${board.map(b=>`<div class="brow ${b.pid===meId?"me":""}"><span class="pos">${b.pos<=3&&b.score>0?["🥇","🥈","🥉"][b.pos-1]:b.pos}</span><span class="av">${esc(b.badge)}</span><span>${esc(b.name)}</span><span class="pts">${fmt(b.score)}</span></div>`).join("")}</div>`;}

    const r=H.lastRev,q=H.cur.q;

    <button class="btn block" style="margin-top:10px" data-act="hEnd">End quiz now</button></div></div></div>`,"host");

  <div class="card">${boardHtml(b)}</div><div class="row"><button class="btn go" data-act="hRematch">Play again, same room</button><button class="btn" data-act="hAgain">Change settings</button><button class="btn" data-act="home">Home</button></div></div>`,"host");

function plConnect(first){
  return new Promise(res=>{
    if(!PL||PL.closed)return res(false);
    const c=PL.peer.connect(PEER_PREFIX+PL.code);let done=false;
    c.on("open",()=>{if(done)return;done=true;PL.conn=c;send(c,{t:"hello",pid:PL.pid,name:ME.name,badge:ME.badge});res(true);plStatus(true);});
    c.on("fail",()=>{if(done)return;done=true;res(false);});
    c.on("data",m=>plRecv(m));
    c.on("close",()=>{if(PL&&PL.conn===c){PL.conn=null;plStatus(false);if(!PL.closed)plReconnect();}});
    if(first)setTimeout(()=>{if(!done){done=true;res(false);}},10000);
  });
}
async function plReconnect(){
  if(!PL||PL.reconnecting)return;PL.reconnecting=true;
  for(let i=0;PL&&!PL.closed&&!PL.conn;i++){await sleep(Math.min(5000,1200+i*600));if(!PL||PL.closed)break;try{if(PL.peer.disconnected)PL.peer.reconnect();}catch(e){}await plConnect(false);}
  if(PL)PL.reconnecting=false;
}
function plStatus(on){const el=$("#plDot");if(el)el.classList.toggle("off",!on);const t=$("#plConn");if(t)t.textContent=on?"connected":"reconnecting…";}
function plTop(){return `<div class="top"><div class="row"><span class="chip">${esc(ME.badge)} ${esc(ME.name)}</span></div><div class="row small muted"><span class="status-dot ${PL&&PL.conn?"":"off"}" id="plDot"></span><span id="plConn">${PL&&PL.conn?"connected":"reconnecting…"}</span><span class="chip">Room ${esc(PL?PL.code:"")}</span><button class="icon-btn" data-act="leaveGame" aria-label="Leave">✕</button></div></div>`;}
function plRecv(m){
  if(!PL||!m||typeof m!=="object")return;
  for(const k of ["n","dur","left","a","players","total","g"])if(m[k]!=null&&!Array.isArray(m[k]))m[k]=Number(m[k])||0;
  if(m.you){m.you.pts=Number(m.you.pts)||0;m.you.pos=Number(m.you.pos)||0;m.you.streak=Number(m.you.streak)||0;m.you.c=m.you.c==null?null:Number(m.you.c);}

  if(m.g!=null&&m.g!==PL.g){PL.g=m.g;PL.n=undefined;PL.revN=-1;PL.xpDone=false;PL.mine=null;PL.lobbySig=null;if(PL.phase!=="connecting")PL.phase="new";}   // a new round in the same room
  if(m.t==="lobby"){
    const sig=JSON.stringify([m.players,m.subs,m.n]);if(PL.phase==="lobby"&&PL.lobbySig===sig)return;PL.lobbySig=sig;PL.phase="lobby";clearInterval(PL.timer);
    render(`<div class="wrap">${plTop()}<div class="card center"><div style="font-size:48px">${esc(ME.badge)}</div><h2>You're in!</h2><p class="muted">Waiting for the host to start…</p>${m.subs?`<p class="small muted">Tonight: ${esc(m.subs.join(", "))} · ${m.n} questions</p>`:""}</div><div class="card"><h3>In the room</h3><div class="pchips">${(m.players||[]).map(p=>`<span class="chip" style="${p.online?"":"opacity:.45"}">${esc(p.badge)} ${esc(p.name)}</span>`).join("")}</div></div></div>`,"play");
    return;
  }
  if(m.t==="q"){
    if(PL.phase==="q"&&PL.n===m.n){if(m.mine==null&&PL.mine!=null&&PL.conn)send(PL.conn,{t:"ans",n:PL.n,c:PL.mine});return;}   // already showing it; re-send a lost answer
    if((PL.phase==="rev"&&PL.revN>=m.n)||PL.phase==="end")return;
    PL.phase="q";PL.n=m.n;PL.q=m.q;PL.mine=m.mine;PL.dur=m.dur;PL.start=Date.now()-(m.dur*1000-m.left);

  }
  if(m.t==="rev"){
    if((PL.phase==="rev"&&PL.revN===m.n)||PL.phase==="end")return;

    const q=m.q||PL.q||{o:["","","",""],q:""};
    render(`<div class="wrap">${plTop()}

     <div class="qbox"><div>${tex(q.q)}</div><div style="margin-top:10px"><b style="color:var(--lime)">Answer:</b> ${tex(q.o[m.a])}</div><div class="small muted" style="margin-top:6px">${tex(m.x)}</div></div>
     <div class="card"><h3>Top 5</h3>${boardHtml(m.board,PL.pid)}</div></div>`,"play");
    return;
  }
  if(m.t==="closed"){
    PL.closed=true;clearInterval(PL.timer);
    render(`<div class="wrap">${topBar("Quiz night")}<div class="card center"><div style="font-size:48px">🏁</div><h2>The host closed the room.</h2><p class="muted">Thanks for playing.</p></div><button class="btn block" data-act="home">Home</button></div>`,"play");
    return;
  }
  if(m.t==="end"){
    if(PL.phase==="end")return;
    PL.phase="end";clearInterval(PL.timer);const me=(m.board||[]).find(b=>b.pid===PL.pid);
    if(me&&!PL.xpDone){PL.xpDone=true;addXP(me.score/50);ST.live++;saveST();}
    if(me&&me.pos===1&&me.score>0){SFX.fanfare();confetti();}
    render(`<div class="wrap">${plTop()}<div class="card center"><div style="font-size:52px">${me&&me.score>0&&me.pos<=3?["🥇","🥈","🥉"][me.pos-1]:"🏁"}</div><h2>${me?"You finished #"+me.pos:"Game over"}</h2><p class="muted">${me?fmt(me.score)+" points":""}</p><p class="small muted">Stay here if the host starts another round.</p></div>
    <div class="card">${boardHtml(m.board||[],PL.pid)}</div><button class="btn block" data-act="home">Home</button></div>`,"play");
  }
}
function recordLive(ok){ST.done++;if(ok)ST.reps++;markDay();saveST();}   // quiz-night questions count as reps
function plRenderQ(){
  const q=PL.q;clearInterval(PL.timer);
  render(`<div class="wrap">${plTop()}
  <div class="row"><span class="chip">Q ${PL.n+1}</span>${subjTag(q.s)}${lvTag(q.lv)}<span class="spacer"></span><b id="plSec" style="font-size:22px"></b></div>
  <div class="timer" id="tm"><i></i></div>
  <div class="qbox"><div class="small muted" style="margin-bottom:6px">${esc(q.t)}</div><div class="qtext">${tex(q.q)}</div>${codeHtml(q.code)}
  <div class="opts">${q.o.map((o,i)=>`<button class="opt o${i} ${PL.mine!=null?(PL.mine===i?"mine":"dim"):""}" data-act="plPick" data-i="${i}" data-silent="1" ${PL.mine!=null?"disabled":""}><span class="sh">${SHAPES[i]}</span><span>${tex(o)}</span></button>`).join("")}</div>
  <div id="plMsg" class="center muted" style="margin-top:12px">${PL.mine!=null?"🔒 Locked in. Waiting for the others…":""}</div></div></div>`,"play");
  PL.timer=setInterval(()=>{const left=PL.dur*1000-(Date.now()-PL.start),el=$("#tm");if(!el)return clearInterval(PL.timer);el.querySelector("i").style.width=Math.max(0,left/(PL.dur*1000)*100)+"%";el.classList.toggle("low",left<PL.dur*250);const s=$("#plSec");if(s)s.textContent=Math.max(0,Math.ceil(left/1000));if(left<=0){clearInterval(PL.timer);if(PL.mine==null){document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.classList.add("dim");});const m=$("#plMsg");if(m)m.textContent="⏱ Time's up";}}},200);
}
ACT.plPick=d=>{
  if(!PL||PL.phase!=="q"||PL.mine!=null)return;
  const left=PL.dur*1000-(Date.now()-PL.start);if(left<=0)return;
  PL.mine=+d.i;SFX.click();
  const msg={t:"ans",n:PL.n,c:PL.mine};
  if(PL.conn)send(PL.conn,msg);
  setTimeout(()=>{if(PL&&PL.conn&&PL.phase==="q"&&PL.n===msg.n)send(PL.conn,msg);},1500);   // once more in case a relay dropped it; the host keeps only the first
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;b.classList.toggle("mine",i===PL.mine);if(i!==PL.mine)b.classList.add("dim");});
  $("#plMsg").textContent="🔒 Locked in. Waiting for the others…";
};
ACT.leaveGame=()=>{leaveLive();home();};
function leaveLive(){
  if(PL){PL.closed=true;clearInterval(PL.timer);try{PL.conn&&PL.conn.close();}catch(e){}try{PL.peer&&PL.peer.destroy();}catch(e){}PL=null;}
  if(H){clearTimeout(H.autoT);clearInterval(H.qT);clearInterval(H.syncT);try{broadcast({t:"closed"});}catch(e){}try{H.peer.destroy();}catch(e){}H=null;}
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
}
window.addEventListener("beforeunload",()=>{try{if(H)H.peer.destroy();if(PL&&PL.peer)PL.peer.destroy();}catch(e){}});

/* ---------- start ---------- */
function route(){
  const m=(location.hash||"").match(/^#join-([A-Za-z]{4})$/);
  if(m){history.replaceState(null,"",location.pathname+location.search);ACT.join({code:m[1].toUpperCase()});return;}
  home();
}
let READY=false;   // a join link opened while the questions are still loading is handled once they are in
window.addEventListener("hashchange",()=>{if(READY)route();});
loadAll().catch(e=>console.error(e)).then(()=>{READY=true;route();});
</script>
