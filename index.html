<script>
/* =====================================================================
   STORE: the one storage module (FNF-91 stage 2 step 2, 22 Nov 2026; the design is FNF_RepMax_Setups §1).
   Every game on glassfiles.github.io shares ONE browser store (one origin), so every key this page saves goes
   through here, under the edition's own names from edition.json "store" (made into window.RM_STORE by
   tools/assemble.py). No other part reads or writes localStorage.
     STORE.get(key, d)   the saved value, or d          STORE.set(key, v)   save (v null or undefined: remove)
     STORE.has(key)      is anything saved under key     STORE.ns(course)    the key prefix for that course
     STORE.sizes()       what this edition and the whole site store here (shown with ?debug=1)
   A save that fails (store full, or blocked) is no longer silent: a notice says so, once a visit.
   ===================================================================== */
window.STORE=(function(C){
  var failed=0,shown=false;
  function ls(){try{return window.localStorage;}catch(e){return null;}}
  function notice(){
    if(shown)return;shown=true;
    var go=function(){var d=document.createElement("div");d.id="store-fail";d.setAttribute("role","alert");
      d.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9999;background:#ffd23f;color:#111;font:600 14px/1.35 system-ui,sans-serif;padding:10px 12px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.4)";
      d.textContent="This device didn't save your progress just now (its storage is full or blocked, for example in private browsing). Settings → Move your progress gives a backup code.";
      d.onclick=function(){d.remove();};document.body.appendChild(d);};
    if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
  }
  function mine(k){if(k===C.profile_key||k.indexOf(C.prefix)===0)return true;
    for(var c in C.course_prefix)if(k.indexOf(C.course_prefix[c])===0)return true;return false;}
  return {
    STAGE:C.stage, PROFILE_KEY:C.profile_key, RELAY_ROOT:C.relay_root, CLIENT_PFX:C.client_prefix,
    ns:function(course){return (C.course_prefix&&C.course_prefix[course])||C.prefix;},
    get:function(k,d){try{var v=ls().getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
    has:function(k){try{return ls().getItem(k)!=null;}catch(e){return false;}},
    set:function(k,v){try{v==null?ls().removeItem(k):ls().setItem(k,JSON.stringify(v));return true;}catch(e){failed++;notice();return false;}},
    failures:function(){return failed;},
    sizes:function(){   /* characters x 2 = bytes as browsers count them (UTF-16); an estimate of what the limit sees */
      var s=ls(),me=0,all=0,n=0;if(!s)return {mine:0,all:0,keys:0};
      for(var i=0;i<s.length;i++){var k=s.key(i),b=(k.length+(s.getItem(k)||"").length)*2;all+=b;if(mine(k)){me+=b;n++;}}
      return {mine:me,all:all,keys:n};}
  };
})(window.RM_STORE);
</script>

<script>
/* Which course: ?p=<course> in the address (and remembered), else the one chosen before on this device. The courses
   are the edition's (window.RM_COURSES, made by assemble.py; Rep Max: alevel, gcse). A quiz-night join link opens the
   host's course (#join-ABCD is the first course, #join-ABCD-gcse names another) without changing the saved choice.
   No course yet: nothing is loaded and the start screen asks; an edition with one course opens straight into it.
   bundle.py replaces this block with the data inlined. */
(function(){
  var OK=window.RM_COURSES,m=location.search.match(new RegExp("[?&]p=("+OK.join("|")+")(?![A-Za-z])")),p=m?m[1]:null;
  if(p)STORE.set(STORE.PROFILE_KEY,p);
  else p=STORE.get(STORE.PROFILE_KEY,null);
  if(OK.indexOf(p)<0)p=null;
  var j=location.hash.match(new RegExp("^#join-[A-Za-z]{4}(?:-("+OK.join("|")+"))?$"));
  if(j)p=j[1]||OK[0];   // a join link opens the host's course (the first unless it names another) without changing the saved choice
  if(!p&&OK.length===1)p=OK[0];   // one course: no chooser
  window.RM.profile=p;
  if(p)document.write('<script src="data/'+p+'/spec.js"><\/script><script src="data/'+p+'/generators.js"><\/script>');
})();
</script>

function qSig(q){const t=JSON.stringify([q.q,q.o,q.a]);let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h;}
function flagged(q){const f=(ST.flags||{})[q.id];if(!f)return false;if(f.sig!==qSig(q)){delete ST.flags[q.id];saveST();return false;}return true;}
function playable(pool,useCover){let p=pool.filter(q=>!NOTYET[keyOf(q)]&&!flagged(q));if(useCover&&taughtOn())p=p.filter(inTaught);return p;}
const topicQs=(s,tid)=>BANK.filter(q=>q.s===s&&q.t===tid);
function mastery(s,tid){const qs=topicQs(s,tid);if(!qs.length)return null;let m=0,n=0,seen=0;for(const q of qs){const r=ST.q[q.id];if(r){m+=Math.min(r.box,4)/4;n+=r.n;seen++;}}return{m:seen?m/seen:0,n,seen};}
function markNotYet(k){const was=!!TAUGHT[k];if(was){delete TAUGHT[k];lsSet("taught",TAUGHT);}NOTYET[k]=true;lsSet("notyet",NOTYET);return was;}
function cardHtml(c){if(!c)return"";return `<div class="keycard"><div class="small muted">Key idea · AI-drafted: report it if it's wrong</div><div style="margin-top:4px">${tex(c.key)}</div>${c.trap?`<div class="small" style="margin-top:6px"><b>Common trap:</b> ${tex(c.trap)}</div>`:""}${c.ref?`<div class="small muted" style="margin-top:4px">${esc(c.ref)}</div>`:""}${c.s?`<button class="linkb rptl" data-act="flagCard" data-k="${esc(c.s+"|"+c.t)}">🚩 Report</button>`:""}</div>`;}
function reportText(q,perm){perm=perm||[0,1,2,3];return `${APP}: question ${q.id}${q.gen?" (generated)":""} may be wrong.\n${SUBJ[q.s].name}, ${topicOf(q).name}\nQ: ${q.q}${q.code?"\n"+q.code:""}\nOptions: ${perm.map((k,i)=>SHAPES[i]+" "+q.o[k]).join("   ")}\nMarked right: ${q.o[q.a]}\nWhat I think is wrong: `;}

function tone(f,dur,type="sine",vol=.2,when=0,slide=null){if(MUTED)return;const c=ac();if(!c)return;const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);}

// a friend per section (FNF-113): skin.json guide.cast maps a mode ("daily", "sprint") or a theme (the topic id's first part, "1".."4")
// to a friend with their own pics; a pose they do not have yet falls back to the host's
function castOf(mode,q){const C=(GUIDE&&GUIDE.cast)||{};return C[mode]||(q&&C[String(q.t||"").split(".")[0]])||null;}
// a reaction may be any of several poses the friend has (guide.alts: right -> right, peace, heart ...), one picked at random
function guideImgFor(k,cls,mode,q){const c=castOf(mode,q),alts=[k,...(((GUIDE&&GUIDE.alts)||{})[k]||[])],have=c&&c.pics?alts.filter(x=>c.pics[x]):[];
  const p=have.length?c.pics[have[Math.floor(Math.random()*have.length)]]:"";return p?`<img class="gpic ${cls||""}" src="${p}" alt="" aria-hidden="true" decoding="async">`:guideImg(k,cls);}

function guideSplash(){

/* v1.10 Today: when nothing is due, the biggest gap across every subject */
function gapOf(s,P){let gap=-1,gv=9;P.forEach((g,gi)=>{const av=g.filter(x=>x.st>=0&&mapCounts(s,x.t));if(!av.length)return;const v=av.reduce((a,x)=>a+(x.st>=2?1:x.st===1?.4:0),0)/av.length;if(v<1&&v<gv){gv=v;gap=gi;}});return [gap,gv];}
function todayGap(){const ix=tIndex();let best=null;for(const s of SKEYS){const [gi,v]=gapOf(s,subjStates(ix,s));if(gi>=0&&(!best||v<best[2]))best=[s,gi,v];}
  if(!best)return "";const [s,gi]=best;
  return `<button class="big hero" data-act="mapGo" data-s="${s}" data-g="${gi}"><span class="em">${icn("🎯")}</span><span><b>Today: ${esc(SUBJ[s].short)}, ${esc(SPEC[s].groups[gi].name)}</b><span>Your biggest gap right now. Up to 10 questions, the weakest first</span></span></button>`;}
/* v1.10 share my week: a short note the player may choose to send; nothing is sent by itself */
ACT.shareWeek=()=>{const d=londonDate(),dow=(new Date(d+"T12:00:00Z").getUTCDay()+6)%7,mon=addDays(d,-dow);let n=0;for(const [k,v] of Object.entries(ST.dayN||{}))if(k>=mon&&k<=d)n+=v;
  const ix=tIndex();let gap="";{let best=null;for(const s of SKEYS){const [gi,v]=gapOf(s,subjStates(ix,s));if(gi>=0&&(!best||v<best[2]))best=[s,gi,v];}if(best)gap=`\nBiggest gap: ${SUBJ[best[0]].name}, ${SPEC[best[0]].groups[best[1]].name}`;}
  const t=`${APP} this week (${PRO.tag}): ${weekDays()} study ${weekDays()===1?"day":"days"}, ${n} questions answered.\nTopics mastered: ${masteredCount()}. Topics secure 🔒: ${secureCount()}.${gap}`;
  shareText(t,"Your week is ready to send.");};

const thPic=th=>{const c=castOf("",{t:th+".1"});return c&&c.pics?(c.pics.explain||c.pics.hello||""):"";};

function thNode(x,y,col,m,n){const r=20,c=2*Math.PI*r,f=n?m/n:0;return `<circle cx="${x}" cy="${y}" r="26" fill="transparent"/><circle cx="${x}" cy="${y}" r="${r}" class="thnd" style="stroke:${col}"/>`+

function calcOK(s){return SET.calc!==false&&CALC_SUBJ.has(s);}
function calcBtn(s,la){return calcOK(s)?`<button class="${la?"linkb":"icon-btn"}" ${la?'data-la="calc" style="min-height:44px;min-width:44px"':'data-act="calc"'} aria-label="Calculator">🧮</button>`:"";}
const CALC={tok:[],ans:0,deg:true,inv:false,out:"",val:null,frac:false,done:false,s:""};
const CDISP={"*":"×","/":"÷","-":"−",neg:"−",E:"×10^",pi:"π",e:"e",Ans:"Ans",C:"C",sq:"²",cube:"³","!":"!",
  "sin(":"sin(","cos(":"cos(","tan(":"tan(","asin(":"sin⁻¹(","acos(":"cos⁻¹(","atan(":"tan⁻¹(","log(":"log(","ln(":"ln(",
  "sqrt(":"√(","cbrt(":"∛(","pow10(":"10^(","exp(":"e^("};
const CFUN=new Set(["sin(","cos(","tan(","asin(","acos(","atan(","log(","ln(","sqrt(","cbrt(","pow10(","exp("]);
function calcEval(tok,deg,ans){
  // numbers first: digits and points join; a number followed by E, an optional minus and digits is one number
  const T=[];for(let i=0;i<tok.length;i++){const k=tok[i];
    if(/^[0-9.]$/.test(k)){let n=k;while(i+1<tok.length&&/^[0-9.]$/.test(tok[i+1]))n+=tok[++i];
      if(tok[i+1]==="E"){let j=i+2,ex="";if(tok[j]==="neg"||tok[j]==="-"){ex="-";j++;}let d="";while(j<tok.length&&/^[0-9]$/.test(tok[j]))d+=tok[j++];if(!d)throw"Syntax error";n+="e"+ex+d;i=j-1;}
      if((n.match(/\./g)||[]).length>1||n===".")throw"Syntax error";T.push({n:parseFloat(n)});}
    else if(k==="E")throw"Syntax error";else T.push(k);}
  let p=0;const peek=()=>T[p],eat=()=>T[p++];
  const starts=t=>t!==undefined&&(typeof t==="object"||t==="pi"||t==="e"||t==="Ans"||t==="("||CFUN.has(t));
  const rad=x=>deg?x*Math.PI/180:x,unrad=x=>deg?x*180/Math.PI:x;
  const fact=n=>{if(!Number.isInteger(n)||n<0||n>170)throw"Math error";let r=1;for(let i=2;i<=n;i++)r*=i;return r;};
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=eat(),w=term();v=o==="+"?v+w:v-w;}return v;}
  function term(){let v=unary();for(;;){const t=peek();if(t==="*"||t==="/"){eat();const w=unary();if(t==="/"&&w===0)throw"Math error";v=t==="*"?v*w:v/w;}else if(starts(t)){v*=unary();}else break;}return v;}
  function unary(){const t=peek();if(t==="neg"||t==="-"){eat();return -unary();}if(t==="+"){eat();return unary();}return power();}
  function power(){const b=ncr();if(peek()==="^"){eat();const x=unary();const r=Math.pow(b,x);if(Number.isNaN(r))throw"Math error";return r;}return b;}
  function ncr(){let a=post();if(peek()==="C"){eat();const r=post();if(!Number.isInteger(a)||!Number.isInteger(r)||r<0||a<0||r>a)throw"Math error";let v=1;for(let i=1;i<=r;i++)v=v*(a-r+i)/i;a=Math.round(v);}return a;}
  function post(){let v=prim();for(;;){const t=peek();if(t==="!"){eat();v=fact(v);}else if(t==="sq"){eat();v=v*v;}else if(t==="cube"){eat();v=v*v*v;}else break;}return v;}
  function prim(){const t=eat();if(t===undefined)throw"Syntax error";
    if(typeof t==="object")return t.n;if(t==="pi")return Math.PI;if(t==="e")return Math.E;if(t==="Ans")return ans;
    if(t==="("){const v=expr();if(peek()===")")eat();return v;}
    if(CFUN.has(t)){const x=expr();if(peek()===")")eat();let r;
      switch(t){case"sin(":r=Math.sin(rad(x));break;case"cos(":r=Math.cos(rad(x));break;
        case"tan(":{if(Math.abs(Math.cos(rad(x)))<1e-12)throw"Math error";r=Math.tan(rad(x));break;}
        case"asin(":case"acos(":if(x<-1||x>1)throw"Math error";r=unrad(t==="asin("?Math.asin(x):Math.acos(x));break;
        case"atan(":r=unrad(Math.atan(x));break;case"log(":if(x<=0)throw"Math error";r=Math.log10(x);break;
        case"ln(":if(x<=0)throw"Math error";r=Math.log(x);break;case"sqrt(":if(x<0)throw"Math error";r=Math.sqrt(x);break;
        case"cbrt(":r=Math.cbrt(x);break;case"pow10(":r=Math.pow(10,x);break;case"exp(":r=Math.exp(x);break;}
      if(Math.abs(r)<1e-13)r=0;return r;}
    throw"Syntax error";}
  if(!T.length)throw"Syntax error";const v=expr();if(p<T.length)throw"Syntax error";if(!Number.isFinite(v))throw"Math error";return v;}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function calcFmt(v){if(v===0)return"0";const a=Math.abs(v);let r;
  if(a>=1e10||a<1e-9){const [m,ex]=v.toExponential(9).split("e");r=m.replace(/\.?0+$/,"")+"×10"+String(+ex).split("").map(c=>SUP[c]||c).join("");}
  else r=String(Number(v.toPrecision(10)));return r.replace(/^-/,"−");}
function calcFrac(v){if(!Number.isFinite(v)||Number.isInteger(v)||Math.abs(v)>1e9)return null;let h1=1,h0=0,k1=0,k0=1,x=v;
  for(let i=0;i<30;i++){const a=Math.floor(x);[h1,h0]=[a*h1+h0,h1];[k1,k0]=[a*k1+k0,k1];if(k1>10000)return null;if(Math.abs(v-h1/k1)<1e-9*Math.max(1,Math.abs(v)))return k1===1?null:(h1<0?"−":"")+Math.abs(h1)+"/"+k1;x=1/(x-a);if(!Number.isFinite(x))break;}
  return null;}
function calcShow(){const o=document.querySelector(".calcov");if(!o)return;const C=CALC;
  o.querySelector(".cexp").textContent=C.tok.map(k=>CDISP[k]!==undefined?CDISP[k]:k).join("")||"\u00a0";
  const fr=C.frac&&C.val!=null?calcFrac(C.val):null;o.querySelector(".cres").textContent=C.out?(fr||C.out):"\u00a0";
  o.querySelector(".cmode").textContent=(C.deg?"DEG":"RAD")+(C.inv?" · INV":"");
  o.querySelectorAll("[data-ck=inv]").forEach(b=>b.classList.toggle("on",C.inv));o.querySelectorAll("[data-ck=sd]").forEach(b=>b.classList.toggle("on",C.frac));
  const L=C.inv?{sin:"sin⁻¹",cos:"cos⁻¹",tan:"tan⁻¹",sq:"x³",sqrt:"∛",log:"10ˣ",ln:"eˣ"}:{sin:"sin",cos:"cos",tan:"tan",sq:"x²",sqrt:"√",log:"log",ln:"ln"};
  for(const k in L){const b=o.querySelector(`[data-ck=${k}]`);if(b)b.textContent=L[k];}}
function calcKey(k){const C=CALC;
  if(k==="eq"){if(!C.tok.length)return;try{const v=calcEval(C.tok,C.deg,C.ans);C.val=v;C.ans=v;C.out=calcFmt(v);}catch(e){C.val=null;C.out=typeof e==="string"?e:"Math error";}C.done=true;C.frac=false;calcShow();return;}
  if(k==="ac"){C.tok=[];C.out="";C.val=null;C.done=false;C.frac=false;calcShow();return;}
  if(k==="del"){if(C.done){C.done=false;C.out="";C.val=null;}C.tok.pop();calcShow();return;}
  if(k==="deg"){C.deg=!C.deg;calcShow();return;}
  if(k==="inv"){C.inv=!C.inv;calcShow();return;}
  if(k==="sd"){if(C.val!=null&&calcFrac(C.val))C.frac=!C.frac;calcShow();return;}
  const fn={sin:"sin(",cos:"cos(",tan:"tan(",log:"log(",ln:"ln(",sqrt:"sqrt("},ifn={sin:"asin(",cos:"acos(",tan:"atan(",log:"pow10(",ln:"exp(",sqrt:"cbrt("};
  let add;if(fn[k])add=[C.inv?ifn[k]:fn[k]];else if(k==="sq")add=[C.inv?"cube":"sq"];else if(k==="pow")add=["^"];else add=[k];
  if(fn[k]||k==="sq")C.inv=false;
  const op=["+","-","*","/","^","sq","cube","!","C","E"].includes(add[0]);
  if(C.done){C.tok=op?["Ans"]:[];C.done=false;C.out="";C.val=null;C.frac=false;}
  C.tok.push(...add);calcShow();}
function calcKeydown(e){if(!document.querySelector(".calcov"))return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const m={"Enter":"eq","=":"eq","Backspace":"del","Escape":"close","*":"*","x":"*","/":"/","+":"+","-":"-","^":"^","(":"(",")":")",".":".","!":"!"};
  let k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(!k)return;e.preventDefault();if(k==="close")return calcClose();calcKey(k);}
function calcOpen(s){if(document.querySelector(".calcov"))return calcClose();CALC.s=s||"";const o=document.createElement("div");o.className="calcov";
  const K=(k,l,c)=>`<button class="ck ${c||""}" data-ck="${k}">${l}</button>`;
  o.innerHTML=`<div class="calc" role="dialog" aria-label="Calculator"><div class="chead"><b>🧮 Calculator</b><span class="cmode"></span><button class="ck fn" data-ck="close" aria-label="Close the calculator" style="min-width:44px">✕</button></div>
  ${PROFILE==="gcse"&&s==="maths"?`<div class="cnote">Paper 1 is non-calculator, so try some without it.</div>`:""}
  <div class="cdisp"><div class="cexp"></div><div class="cres" aria-live="polite"></div></div>
  <div class="ckeys">${K("deg","DEG/RAD","fn")}${K("inv","inv","fn")}${K("sin","sin","fn")}${K("cos","cos","fn")}${K("tan","tan","fn")}
  ${K("sq","x²","fn")}${K("pow","xʸ","fn")}${K("sqrt","√","fn")}${K("log","log","fn")}${K("ln","ln","fn")}
  ${K("pi","π","fn")}${K("e","e","fn")}${K("!","x!","fn")}${K("C","nCr","fn")}${K("E","×10ˣ","fn")}
  ${K("(","(","fn")}${K(")",")","fn")}${K("Ans","Ans","fn")}${K("del","⌫","fn")}${K("ac","AC","fn")}
  ${K("7","7","num")}${K("8","8","num")}${K("9","9","num")}${K("/","÷","op")}${K("neg","(−)","op")}
  ${K("4","4","num")}${K("5","5","num")}${K("6","6","num")}${K("*","×","op")}${K("sd","S⇔D","fn")}
  ${K("1","1","num")}${K("2","2","num")}${K("3","3","num")}${K("-","−","op")}${K("+","+","op")}
  ${K("0","0","num zero")}${K(".",".","num")}${K("eq","=","eq")}</div></div>`;
  o.addEventListener("click",e=>{const b=e.target.closest("[data-ck]");if(!b)return;const k=b.dataset.ck;if(k==="close")return calcClose();calcKey(k);});
  document.body.appendChild(o);document.addEventListener("keydown",calcKeydown);calcShow();
  document.body.style.paddingBottom=o.querySelector(".calc").offsetHeight+"px";
  const qt=document.querySelector(".qtext");if(qt)window.scrollTo(0,Math.max(0,window.scrollY+qt.getBoundingClientRect().top-12));}   // the question to the top, above the calculator   // the page scrolls clear of the calculator, so all of the question can be read above it
function calcClose(){const o=document.querySelector(".calcov");if(o)o.remove();document.body.style.paddingBottom="";document.removeEventListener("keydown",calcKeydown);}

ACT.gStart=()=>{
  const w=WORKOUTS[GYM.w];
  let pool=BANK.filter(q=>sOn(q.s));
  if(GYM.topic)pool=pool.filter(q=>keyOf(q)===GYM.topic);   // one topic chosen in the tracker: ask it whatever the ticks say
  else pool=playable(pool,GYM.taught);
  let qs;
  if(GYM.topic){
    const rank=q=>(ST.q[q.id]?2:0)+(q.gen?0:1);
    qs=shuffle(pool).sort((a,b)=>rank(a)-rank(b)||((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0)).slice(0,w.n);
    const gens=pool.filter(q=>q.gen);for(let k=0;qs.length<w.n&&gens.length;k++)qs.push(gens[k%gens.length]);
  }else if(GYM.w==="weak"){
    const seen=pool.filter(q=>ST.q[q.id]);
    const weak=seen.filter(q=>ST.q[q.id].box===0||isDue(ST.q[q.id])).sort((a,b)=>ST.q[a.id].box-ST.q[b.id].box||ST.q[a.id].last-ST.q[b.id].last);
    const fresh=shuffle(pool.filter(q=>!ST.q[q.id]));
    qs=[...weak,...fresh].slice(0,w.n);
  }else{
    let p=pool.filter(q=>w.lv.includes(q.lv));
    p=shuffle(p).sort((a,b)=>((ST.q[a.id]||{}).last||0)-((ST.q[b.id]||{}).last||0));   // least recently seen first
    qs=shuffle(p.slice(0,Math.max(w.n,Math.min(p.length,w.n*2)))).slice(0,w.n);
  }
  qs=qs.map(q=>inst(q)).filter(Boolean);
  if(!qs.length){$("#gmsg").textContent=WL.no_match;return;}
  const label=w.name+" · "+(GYM.topic?TOPIC[GYM.topic].name:sName());
  startRun({mode:"gym",qs,label,clock:GYM.clock,key:GYM.w+"|"+(GYM.topic||GYM.s)});
};

  ${timed?`<div class="timer" id="tm"><i></i><b></b></div>`:""}
  <div class="qbox"><div class="row" style="margin-bottom:10px">${subjTag(q.s)}${lvTag(q.lv)}<span class="small muted">${esc(tp.name)}</span>${calcOK(q.s)?`<span class="spacer"></span>${calcBtn(q.s)}`:""}</div>

let DCLOCK=lsGet("dclock",false);
function dailySet(date){
  const rnd=mulberry32(hashStr("repmax-daily-"+date));
  let pool=playable(BANK,true);
  if(!pool.length)pool=playable(BANK,false);   // ticks only in subjects with no questions yet: use every topic
  const subs=SKEYS.filter(s=>pool.some(q=>q.s===s&&q.lv<=2));
  const lists=Object.fromEntries(subs.map(s=>[s,shuffle(pool.filter(q=>q.s===s&&q.lv<=2),rnd)]));
  const chosen=[];let k=0;
  while(chosen.length<8&&subs.some(s=>lists[s].length)){const s=subs[k++%subs.length];if(lists[s].length)chosen.push(lists[s].shift());}
  const hard=shuffle(pool.filter(q=>q.lv===3&&!chosen.includes(q)),rnd).slice(0,2);
  let qs=[...shuffle(chosen,rnd),...hard];
  if(qs.length<10)qs=qs.concat(shuffle(pool.filter(q=>!qs.includes(q)),rnd).slice(0,10-qs.length));
  return mixTopics(qs.slice(0,10)).map(q=>inst(q,mulberry32(hashStr(date+"|"+q.id)))).filter(Boolean);
}

/* =====================================================================
   LIVE QUIZ NIGHT
   Relay transport adapted from Nose Knows: messages go through every public
   MQTT broker that answers and are de-duplicated on arrival. No accounts.
   The host's screen is in charge: it picks questions, keeps the answer key,
   times each question and scores. Phones send only their pick.
   ===================================================================== */
const PEER_PREFIX="rep-max-v1-";
const MQTT_SRC=["lib/mqtt.min.js","https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js","https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"];
const BROKERS=[{url:"wss://public.cloud.shiftr.io:443/mqtt",username:"public",password:"public"},{url:"wss://broker.emqx.io:8084/mqtt"},{url:"wss://broker.hivemq.com:8884/mqtt"}];
const RELAY_ROOT=STORE.RELAY_ROOT;   // quiz-room root, from edition.json "store"
const rid=(n=12)=>{const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";const r=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(n)):null;for(let i=0;i<n;i++)s+=a[(r?r[i]:Math.floor(Math.random()*256))%a.length];return s;};
class RelayEmitter{constructor(){this._h={};}on(e,f){(this._h[e]=this._h[e]||new Set()).add(f);return this;}off(e,f){if(this._h[e])this._h[e].delete(f);return this;}emit(e,...a){[...(this._h[e]||[])].forEach(f=>{try{f(...a);}catch(x){console.error(x);}});}}
class RelayConn extends RelayEmitter{
  constructor(peer,remote,cid){super();this._peer=peer;this.remote=remote;this.cid=cid;this.open=false;this.lastSeen=Date.now();}
  send(obj){if(!this.open)throw new Error("closed");this._peer._pub(this.remote,{t:"d",cid:this.cid,d:obj});}
  close(){if(this._dropped)return;try{this._peer._pub(this.remote,{t:"x",cid:this.cid});}catch(e){}this._drop();}
  _drop(){if(this._dropped)return;this._dropped=true;this.open=false;this._peer.conns.delete(this.cid);clearInterval(this._retry);this.emit("close");}
}
class RelayPeer extends RelayEmitter{
  constructor(id){super();this.claim=typeof id==="string";this.id=this.claim?id:"p-"+rid(14);this.destroyed=false;this.conns=new Map();this.clients=[];this.nonce=rid(10);this._seen=new Set();this._seenQ=[];this._open=false;this._taken=false;setTimeout(()=>this._start(),0);}
  get disconnected(){return !this.clients.some(c=>c.connected);}
  _topic(id){return RELAY_ROOT+id;}
  _start(){
    let first=true;
    const failT=setTimeout(()=>{if(first&&!this.destroyed)this.emit("error",{type:"network"});},12000);
    for(const b of BROKERS){
      let c;try{c=mqtt.connect(b.url,{clientId:STORE.CLIENT_PFX+rid(14),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30,...(b.username?{username:b.username,password:b.password}:{})});}catch(e){continue;}
      this.clients.push(c);
      c.on("connect",()=>{c.subscribe(this._topic(this.id),{qos:0},()=>{if(first&&!this.destroyed){first=false;clearTimeout(failT);this._ready();}});});
      c.on("message",(t,buf)=>{let m;try{m=JSON.parse(buf.toString());}catch(e){return;}this._recv(m);});
      c.on("error",()=>{});
    }
    if(!this.clients.length){clearTimeout(failT);setTimeout(()=>this.emit("error",{type:"network"}));}
    this._hb=setInterval(()=>this._beat(),5000);
  }
  _ready(){
    if(!this.claim){this._open=true;this.emit("open",this.id);return;}
    try{this._pub(this.id,{t:"probe",n:this.nonce});}catch(e){}
    setTimeout(()=>{if(this.destroyed)return;if(this._taken){this.emit("error",{type:"unavailable-id"});this.destroy();return;}this._open=true;this.emit("open",this.id);},1800);
  }
  _pub(target,msg){const live=this.clients.filter(c=>c.connected);if(!live.length)throw new Error("offline");msg.from=this.id;msg.mid=rid(12);const s=JSON.stringify(msg),t=this._topic(target);live.forEach(c=>{try{c.publish(t,s,{qos:0});}catch(e){}});}
  _dup(mid){if(!mid)return false;if(this._seen.has(mid))return true;this._seen.add(mid);this._seenQ.push(mid);if(this._seenQ.length>4000)this._seen.delete(this._seenQ.shift());return false;}
  _recv(m){
    if(!m||typeof m!=="object"||this.destroyed||this._dup(m.mid))return;
    const c=m.cid&&this.conns.get(m.cid);
    switch(m.t){
      case "probe":if(m.n===this.nonce)return;if(this.claim&&this._open)try{this._pub(this.id,{t:"taken",n:m.n});}catch(e){}return;
      case "taken":if(m.n===this.nonce)this._taken=true;return;
      case "open":{
        if(!this._open||typeof m.from!=="string"||typeof m.cid!=="string")return;
        if(c){try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}return;}
        const conn=new RelayConn(this,m.from,m.cid);this.conns.set(m.cid,conn);this.emit("connection",conn);
        conn.open=true;try{this._pub(m.from,{t:"ack",cid:m.cid});}catch(e){}setTimeout(()=>conn.emit("open"));return;}
      case "ack":if(c&&!c.open&&c.remote===m.from){c.open=true;c.lastSeen=Date.now();clearInterval(c._retry);c.emit("open");}return;
      case "d":if(c&&c.remote===m.from){c.lastSeen=Date.now();if(c.open)c.emit("data",m.d);}else if(this.claim&&m.from)try{this._pub(m.from,{t:"x",cid:m.cid});}catch(e){}return;
      case "hb":if(c&&c.remote===m.from)c.lastSeen=Date.now();return;
      case "x":if(c&&c.remote===m.from)c._drop();return;
    }
  }
  _beat(){const now=Date.now();for(const c of [...this.conns.values()]){if(!c.open)continue;if(now-c.lastSeen>17000){c._drop();continue;}try{this._pub(c.remote,{t:"hb",cid:c.cid});}catch(e){}}}
  connect(target){
    const cid=rid(14),conn=new RelayConn(this,target,cid);this.conns.set(cid,conn);
    const ask=()=>{try{this._pub(target,{t:"open",cid});}catch(e){}};
    ask();conn._retry=setInterval(()=>{if(conn.open||conn._dropped)return clearInterval(conn._retry);ask();},1500);
    setTimeout(()=>{if(!conn.open&&!conn._dropped){clearInterval(conn._retry);this.conns.delete(cid);conn._dropped=true;conn.emit("fail");}},8000);
    return conn;
  }
  reconnect(){this.clients.forEach(c=>{if(!c.connected)try{c.reconnect();}catch(e){}});}
  destroy(){if(this.destroyed)return;this.destroyed=true;clearInterval(this._hb);[...this.conns.values()].forEach(c=>c.close());this.clients.forEach(c=>{try{c.end(true);}catch(e){}});}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadMqtt(){if(!window.mqtt){for(const s of MQTT_SRC){try{await loadScript(s);if(window.mqtt)break;}catch(e){}}}return !!window.mqtt;}
function peerOnce(id){
  return new Promise((res,rej)=>{
    let p;try{p=new RelayPeer(id);}catch(e){return rej({type:"init"});}
    const t=setTimeout(()=>{try{p.destroy();}catch(e){}rej({type:"timeout"});},14000);
    const onErr=e=>{clearTimeout(t);try{p.destroy();}catch(x){}rej({type:e&&e.type||"error"});};
    p.on("open",()=>{clearTimeout(t);p.off("error",onErr);res(p);});p.on("error",onErr);
  });
}

  if(!(await loadMqtt())){$("#hmsg").textContent="Couldn't load the connection library. Check the internet connection.";return;}
  let peer=null,code=null;
  for(let i=0;i<8&&!peer;i++){code=genCode();try{peer=await peerOnce(PEER_PREFIX+code);}catch(e){if(e.type!=="unavailable-id"){$("#hmsg").textContent="Couldn't open a room ("+e.type+"). The network may block live connections: try another Wi-Fi or a phone hotspot.";return;}}}
  if(!peer){$("#hmsg").textContent="Couldn't get a free room code. Try again.";return;}
  H={peer,code,qs:hostDeal(),game:1,conns:new Map(),players:new Map(),phase:"lobby",i:-1,cur:null,answers:new Map(),autoT:null,qT:null,hostPid:"h-"+myPid()};
  if(HS.play)H.players.set(H.hostPid,{pid:H.hostPid,name:ME.name,badge:ME.badge,score:0,streak:0,host:true,online:true});
  peer.on("connection",conn=>{
    conn.on("data",m=>hostRecv(conn,m));
    conn.on("close",()=>{if(conn._pid&&H&&H.conns.get(conn._pid)===conn){H.conns.delete(conn._pid);const p=H.players.get(conn._pid);if(p)p.online=false;hostRefresh();}});
  });
  peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});
  H.syncT=setInterval(()=>{if(!H)return;for(const [pid,c] of H.conns)hsend(c,{...stateFor(pid),sync:1});},3000);   // relays can drop messages: re-send the current state
  keepAwake();
  hostRender();
};
function hostRecv(conn,m){
  if(!H||!m||typeof m!=="object")return;
  if(m.t==="hello"){
    const pid=String(m.pid||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);if(!pid)return;
    const name=String(m.name||"Player").replace(/[<>]/g,"").slice(0,22)||"Player",badge=String(m.badge||"⭐").slice(0,8);
    conn._pid=pid;const old=H.conns.get(pid);if(old&&old!==conn)try{old.close();}catch(e){}
    H.conns.set(pid,conn);
    const p=H.players.get(pid);
    if(p){p.name=name;p.badge=badge;p.online=true;}else H.players.set(pid,{pid,name,badge,score:0,streak:0,online:true});
    hsend(conn,stateFor(pid));hostRefresh();
    if(H.phase==="lobby")broadcast(lobbyMsg());
    return;
  }
  if(m.t==="ans")hostTakeAnswer(conn._pid,m.n,m.c);
}
function hostTakeAnswer(pid,n,c){
  if(!H||!pid||H.phase!=="q"||n!==H.i||H.answers.has(pid)||!H.players.has(pid))return;
  const ms=Date.now()-H.cur.start;if(ms>H.cur.dur*1000+GRACE)return;
  c=+c;if(!(c>=0&&c<4))return;
  H.answers.set(pid,{c,ms});
  const box=$("#hAns");if(box)box.textContent=H.answers.size+" / "+activeCount()+" answered";
  if(H.answers.size>=activeCount())setTimeout(()=>{if(H&&H.phase==="q"&&H.cur&&n===H.i)hostReveal();},400);
}
const activeCount=()=>[...H.players.values()].filter(p=>p.online||p.host).length;
const send=(c,o)=>{try{c.send(o);}catch(e){}};
const hsend=(c,o)=>send(c,{...o,g:H?H.game:0});

function playerList(){return [...H.players.values()].map(p=>({pid:p.pid,name:p.name,badge:p.badge,online:!!(p.online||p.host)}));}
function boardList(){return [...H.players.values()].sort((a,b)=>b.score-a.score||(a.tsum||0)-(b.tsum||0)).map((p,i)=>({pid:p.pid,name:p.name,badge:p.badge,score:p.score,pos:i+1}));}
function lobbyMsg(){return{t:"lobby",players:playerList(),code:H.code,subs:HS.subs.map(s=>SUBJ[s].name),n:H.qs.length};}
function qMsg(){const q=H.cur.q;return{t:"q",n:H.i,total:H.qs.length,dur:H.cur.dur,left:Math.max(0,H.cur.dur*1000-(Date.now()-H.cur.start)),q:{id:q.id,s:q.s,t:topicOf(q).name,lv:q.lv,q:q.q,code:q.code||"",fig:q.fig||null,o:H.cur.perm.map(k=>q.o[k])}};}
function stateFor(pid){
  if(H.phase==="lobby")return lobbyMsg();

  if(H.phase==="rev")return{...H.lastRev,you:H.lastRev.res[pid]||null};

}
function hostStart(){if(!H||H.phase!=="lobby"||!H.qs.length)return;hostQuestion(0);}
function hostQuestion(i){
  clearTimeout(H.autoT);clearInterval(H.qT);
  H.i=i;H.phase="q";H.answers=new Map();
  const q=H.qs[i];H.cur={q,perm:shuffle([0,1,2,3]),start:Date.now(),dur:HS.dur*(q.lv===3?2:1)};

function hostReveal(){
  if(!H||H.phase!=="q")return;clearInterval(H.qT);
  const q=H.cur.q,right=H.cur.perm.indexOf(q.a),res={},counts=[0,0,0,0];
  for(const [pid,p] of H.players){
    const a=H.answers.get(pid);
    if(a)counts[a.c]++;

    else{p.streak=0;res[pid]={ok:false,pts:0,c:a?a.c:null};}
  }
  const board=boardList();board.forEach(b=>{if(res[b.pid])res[b.pid].pos=b.pos;});
  H.phase="rev";H.lastRev={t:"rev",n:H.i,total:H.qs.length,a:right,x:q.x||"",counts,res,board:board.slice(0,5),players:board.length,q:{q:q.q,code:q.code||"",o:H.cur.perm.map(k=>q.o[k])}};

function hostNext(){if(!H)return;clearTimeout(H.autoT);if(H.i+1<H.qs.length)hostQuestion(H.i+1);else hostEnd();}
function hostEnd(){

function plConnect(first){
  return new Promise(res=>{
    if(!PL||PL.closed)return res(false);
    const c=PL.peer.connect(PEER_PREFIX+PL.code);let done=false;
    c.on("open",()=>{if(done)return;done=true;PL.conn=c;send(c,{t:"hello",pid:PL.pid,name:ME.name,badge:ME.badge});res(true);plStatus(true);});
    c.on("fail",()=>{if(done)return;done=true;res(false);});
    c.on("data",m=>plRecv(m));
    c.on("close",()=>{if(PL&&PL.conn===c){PL.conn=null;plStatus(false);if(!PL.closed)plReconnect();}});
    if(first)setTimeout(()=>{if(!done){done=true;res(false);}},10000);
  });
}
async function plReconnect(){
  if(!PL||PL.reconnecting)return;PL.reconnecting=true;
  for(let i=0;PL&&!PL.closed&&!PL.conn;i++){await sleep(Math.min(5000,1200+i*600));if(!PL||PL.closed)break;try{if(PL.peer.disconnected)PL.peer.reconnect();}catch(e){}await plConnect(false);}
  if(PL)PL.reconnecting=false;
}
function plStatus(on){const el=$("#plDot");if(el)el.classList.toggle("off",!on);const t=$("#plConn");if(t)t.textContent=on?"connected":"reconnecting…";}
function plTop(){return `<div class="top"><div class="row"><span class="chip">${esc(ME.badge)} ${esc(ME.name)}</span></div><div class="row small muted"><span class="status-dot ${PL&&PL.conn?"":"off"}" id="plDot"></span><span id="plConn">${PL&&PL.conn?"connected":"reconnecting…"}</span><span class="chip">Room ${esc(PL?PL.code:"")}</span><button class="icon-btn" data-act="leaveGame" aria-label="Leave">✕</button></div></div>`;}
function plRecv(m){

  for(const k of ["n","dur","left","a","players","total","g"])if(m[k]!=null&&!Array.isArray(m[k]))m[k]=Number(m[k])||0;
  if(m.you){m.you.pts=Number(m.you.pts)||0;m.you.pos=Number(m.you.pos)||0;m.you.streak=Number(m.you.streak)||0;m.you.c=m.you.c==null?null:Number(m.you.c);}

  if(m.g!=null&&m.g!==PL.g){PL.g=m.g;PL.n=undefined;PL.revN=-1;PL.xpDone=false;PL.mine=null;PL.lobbySig=null;if(PL.phase!=="connecting")PL.phase="new";}   // a new round in the same room
  if(m.t==="lobby"){
    const sig=JSON.stringify([m.players,m.subs,m.n]);if(PL.phase==="lobby"&&PL.lobbySig===sig)return;PL.lobbySig=sig;PL.phase="lobby";clearInterval(PL.timer);
    render(`<div class="wrap">${plTop()}<div class="card center"><div style="font-size:48px">${esc(ME.badge)}</div><h2>You're in!</h2><p class="muted">Waiting for the host to start…</p>${m.subs?`<p class="small muted">Tonight: ${esc(m.subs.join(", "))} · ${m.n} questions</p>`:""}</div><div class="card"><h3>In the room</h3><div class="pchips">${(m.players||[]).map(p=>`<span class="chip" style="${p.online?"":"opacity:.45"}">${esc(p.badge)} ${esc(p.name)}</span>`).join("")}</div></div></div>`,"play");
    return;
  }
  if(m.t==="q"){
    if(PL.phase==="q"&&PL.n===m.n){if(m.mine==null&&PL.mine!=null&&PL.conn)send(PL.conn,{t:"ans",n:PL.n,c:PL.mine});return;}   // already showing it; re-send a lost answer
    if((PL.phase==="rev"&&PL.revN>=m.n)||PL.phase==="end")return;
    PL.phase="q";PL.n=m.n;PL.q=m.q;PL.mine=m.mine;PL.dur=m.dur;PL.start=Date.now()-(m.dur*1000-m.left);

     <div class="qbox"><div>${tex(q.q)}</div><div style="margin-top:10px"><b style="color:var(--accent)">Answer:</b> ${tex(q.o[m.a])}</div><div class="small muted" style="margin-top:6px">${tex(m.x)}</div></div>
     <div class="card"><h3>Top 5</h3>${boardHtml(m.board,PL.pid)}</div></div>`,"play");
    return;
  }
  if(m.t==="closed"){
    PL.closed=true;clearInterval(PL.timer);
    render(`<div class="wrap">${topBar("Quiz night")}<div class="card center"><div style="font-size:48px">🏁</div><h2>The host closed the room.</h2><p class="muted">Thanks for playing.</p></div><button class="btn block" data-act="home">Home</button></div>`,"play");
    return;
  }
  if(m.t==="end"){
    if(PL.phase==="end")return;
    PL.phase="end";clearInterval(PL.timer);const me=(m.board||[]).find(b=>b.pid===PL.pid);
    if(me&&!PL.xpDone){PL.xpDone=true;addXP(me.score/50);ST.live++;saveST();}

    <div class="card">${boardHtml(m.board||[],PL.pid)}</div><button class="btn block" data-act="home">Home</button></div>`,"play");
  }

function plRenderQ(){

  <div class="opts">${q.o.map((o,i)=>`<button class="opt o${i} ${PL.mine!=null?(PL.mine===i?"mine":"dim"):""}" data-act="plPick" data-i="${i}" data-silent="1" ${PL.mine!=null?"disabled":""}><span class="sh">${SHAPES[i]}</span><span>${tex(o)}</span></button>`).join("")}</div>

}
ACT.plPick=d=>{

/* =====================================================================
   SPRINT (16 Nov 2026): as many questions as possible against one clock.
   Points by level, so harder questions are worth more: level 1 = 1, level 2 = 2, level 3 = 3.
   A wrong answer costs 3 seconds; Skip costs 2 seconds, so a hard question never traps you.
   Answers count towards the tracker and spaced repetition like any other rep. Best score per course,
   subject and length is kept on this device.
   ===================================================================== */
const SPRINT_LENS=[60,120,180];
let SPS=Object.assign({len:60},lsGet("sprint",{}));
if(!SPRINT_LENS.includes(SPS.len))SPS.len=60;
let SP=null,SPT=null;
const SP_PTS={1:1,2:2,3:3},SP_WRONG=3,SP_SKIP=2;
ACT.sprint=()=>{
  setWide(false);
  const lens=SPRINT_LENS.map(l=>`<button class="chip ${SPS.len===l?"on":""}" data-act="spL" data-l="${l}">${l<120?l+" s":l/60+" min"}</button>`).join("");
  const best=ST.best["sprint|"+SPS.len+"|"+GYM.s];
  render(`<div class="wrap">${topBar("Sprint")}
  <div class="card"><b style="font-size:18px">⚡ As many as you can</b><p class="small muted" style="margin:6px 0 0">One clock for the whole sprint. Level 1 questions score 1 point, level 2 score 2, level 3 score 3. A wrong answer costs ${SP_WRONG} seconds; Skip costs ${SP_SKIP}. Sprint uses questions you have already got right, topped up with ${esc(WL.warmups)}, so it is fast recall, not new learning.</p></div>
  <div class="card"><h3>Subjects</h3><div class="pchips">${sChips("spS")}</div></div>
  <div class="card"><h3>Length</h3><div class="pchips">${lens}</div>
  <div class="small muted" style="margin-top:8px">Your best here: ${best?best+" points":"none yet"}</div></div>
  <div class="card">${coverRow("spTaught",GYM.taught,"sprint")}</div>
  <button class="btn go block" data-act="spGo" style="font-size:18px;padding:16px">Start sprint</button>
  <p class="small muted center" id="spmsg"></p></div>`,"sprint");
};
ACT.spS=d=>{sToggle(d.s);GYM.topic=null;lsSet("gym",GYM);ACT.sprint();};
ACT.spL=d=>{SPS.len=+d.l;lsSet("sprint",SPS);ACT.sprint();};
ACT.spTaught=()=>{GYM.taught=!GYM.taught;lsSet("gym",GYM);ACT.sprint();};
function spPool(){const all=playable(BANK.filter(q=>sOn(q.s)),GYM.taught);const known=all.filter(q=>((ST.q[q.id]||{}).c||0)>=1);if(known.length>=20)return known;const warm=all.filter(q=>q.lv===1&&!known.includes(q));return known.concat(warm.length?warm:all.filter(q=>!known.includes(q)));}
ACT.spGo=()=>{
  const pool=spPool();
  if(!pool.length){$("#spmsg").textContent="No questions match those settings yet. Try another subject, or check what you've covered.";return;}
  SP={len:SPS.len,s:GYM.s,end:Date.now()+SPS.len*1000,pool:shuffle(pool.slice()),k:0,q:null,perm:null,pts:0,right:0,wrong:0,skips:0,res:[],locked:false};
  spNext();
  clearInterval(SPT);SPT=setInterval(spTick,200);
};
function spTick(){
  if(!SP)return clearInterval(SPT);
  const left=SP.end-Date.now();tmSet($("#tm"),left,SP.len*1000);
  if(left<=0){clearInterval(SPT);spEnd();}
}
function spNext(){
  if(SP.k>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.k=0;}
  if(SP.q){const pk=keyOf(SP.q);for(let j=SP.k;j<Math.min(SP.pool.length,SP.k+8);j++){if(keyOf(SP.pool[j])!==pk){[SP.pool[SP.k],SP.pool[j]]=[SP.pool[j],SP.pool[SP.k]];break;}}}
  let q=null;for(let tries=0;!q&&tries<SP.pool.length;tries++){q=inst(SP.pool[SP.k++]);if(SP.k>=SP.pool.length){SP.pool=shuffle(SP.pool);SP.k=0;}}
  if(!q)return spEnd();
  SP.q=q;SP.perm=shuffle([0,1,2,3]);SP.locked=false;
  render(`<div class="wrap">
  <div class="top"><button class="icon-btn" data-act="spQuit" aria-label="Stop">✕</button>
   <div class="hud"><span class="chip">⚡ ${SP.pts} pts</span><span class="chip">${SP.right} right</span></div>
   <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="icon-btn flagb" data-act="flagSP" aria-label="Report this question">🚩</button><button class="icon-btn" data-act="mute" aria-label="Sound">${MUTED?"🔇":"🔊"}</button></div></div>
  <div class="timer" id="tm"><i></i><b></b></div>
  <div class="qbox"><div class="row" style="margin-bottom:10px">${subjTag(q.s)}${lvTag(q.lv)}<span class="small muted">+${SP_PTS[q.lv]} pt${SP_PTS[q.lv]>1?"s":""}</span>${calcOK(q.s)?`<span class="spacer"></span>${calcBtn(q.s)}`:""}</div>
   <div class="qtext">${tex(q.q)}</div>${codeHtml(q.code)}${figHtml(q.fig)}
   <div class="opts">${SP.perm.map((k,i)=>`<button class="opt o${i}" data-act="spPick" data-i="${i}" data-silent="1"><span class="sh">${SHAPES[i]}</span><span>${tex(q.o[k])}</span></button>`).join("")}</div>
   <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" data-act="spSkip">Skip (−${SP_SKIP} s)</button></div></div></div>`,"sprintq");
  spTick();
}
ACT.spPick=d=>{
  if(!SP||SP.locked)return;SP.locked=true;
  const q=SP.q,right=SP.perm.indexOf(q.a),di=+d.i,ok=di===right;
  recordAnswer(q,ok);SP.res.push({q,ok,di,perm:SP.perm});
  if(ok){SP.right++;SP.pts+=SP_PTS[q.lv];SFX.correct();}else{SP.wrong++;SP.end-=SP_WRONG*1000;SFX.wrong();popText("−"+SP_WRONG+" s");}
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===right)b.classList.add("right");else if(i===di)b.classList.add("mine");else b.classList.add("dim");});
  setTimeout(()=>{if(SP&&SP.end>Date.now())spNext();},ok?350:900);
};
ACT.spSkip=()=>{if(!SP||SP.locked)return;SP.skips++;SP.end-=SP_SKIP*1000;spNext();};
ACT.spQuit=()=>{if(SP&&SP.res&&SP.res.length)askEnd("Stop this sprint?","This sprint won't count.",()=>{clearInterval(SPT);SP=null;home();});else{clearInterval(SPT);SP=null;home();}};   // a sprint stopped early records no score
function spEnd(){
  if(!SP||SP.done)return;SP.done=true;clearInterval(SPT);
  const key="sprint|"+SP.len+"|"+SP.s,prev=ST.best[key]||0,pb=SP.pts>prev&&SP.pts>0;
  if(pb)ST.best[key]=SP.pts;
  addXP(SP.res.filter(r=>r.ok).reduce((a,r)=>a+XP_LV[r.q.lv],0));saveST();
  if(pb&&prev>0){SFX.fanfare();confetti();}
  const n=SP.right+SP.wrong,miss=SP.res.filter(r=>!r.ok);
  render(`<div class="wrap">${topBar("Sprint done","sprint")}
   <div class="card center"><div class="big-num">${SP.pts}</div><div class="muted">points in ${SP.len<120?SP.len+" s":SP.len/60+" min"}</div>
   <div class="muted" style="margin-top:6px">${SP.right} right · ${SP.wrong} wrong · ${SP.skips} skipped${n?" · "+Math.round(SP.right/n*100)+"% accuracy":""}</div>
   ${pb&&prev>0?`<div style="margin-top:10px;font-weight:900;color:var(--accent);font-size:20px">🏆 New best (was ${prev})</div>`:`<div class="small muted" style="margin-top:8px">Best: ${Math.max(prev,SP.pts)} points</div>`}</div>
   ${miss.length?`<div class="card"><h3>Review your misses</h3><div class="list">${miss.slice(0,12).map(r=>`<div class="topic" style="display:block"><div class="row" style="margin-bottom:6px">${subjTag(r.q.s)}<span class="small muted">${esc(topicOf(r.q).name)}</span></div><div>${tex(r.q.q)}</div><div class="small" style="margin-top:6px">Answer: <b>${tex(r.q.o[r.q.a])}</b></div><div class="small muted" style="margin-top:4px">${tex(r.q.x||"")}</div></div>`).join("")}</div></div>`:""}
   <div class="row"><button class="btn go" data-act="spGo">Go again</button><button class="btn" data-act="home">Home</button></div></div>`,"sprintend");
}

/* ---------- touches (FNF-116, FNF-118, FNF-119; Guy 24 Nov 2026 13:44-13:57): small things that show love went into the site.
   Every one is off unless the skin's "touches" turns it on, so an edition without them (Rep Max) is unchanged. The look is the skin's CSS.
   spray: a stencil X sprayed over a wrong answer, with a hiss · brush: a tick brushed onto the right answer · stamp: a seal stamp on the
   finished daily challenge · stickers: a sticker slapped on when a topic is mastered, and a sticker book · wall: a graffiti economics joke
   and a doodle that change each day, at the foot of home · night: after 10pm the page goes candlelit and a bat flits past once ·
   petals: 1 right answer in N lets cherry blossom drift across · tiespin: tap the logo 5 times and the guide spins · tour: the welcome
   cards on a first visit (Settings can show them again) */
const TCH=CFG.skin.touches||null;
function tOn(k){return !!(TCH&&TCH[k]);}
function tDay(){return Math.max(0,dayDiff(LAUNCH,londonDate()));}
function tHash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function tLetters(t){return [...t].map((c,i)=>`<i style="--i:${i}">${c===" "?"&nbsp;":esc(c)}</i>`).join("");}
// a spray-can hiss, made in code (no file): filtered noise
function tHiss(dur,vol,when){if(MUTED)return;const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+(when||0);
  s.buffer=b;f.type="highpass";f.frequency.value=2600;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+dur+.05);}
// after an answer (19_runner.js): spray X on her wrong choice, brush tick on the right one, petals now and then, a sticker when a topic is newly mastered
// the result where she can see it (Guy 25 Nov 00:49: "the response is at the bottom of the screen ... any message that appears from getting
// a right or wrong answer should be more easily visible ... on their phone"): a banner floats just above the button bar, over the answers,
// with the headline, the XP and the guide's reaction; a tap takes her down to the full explanation. It goes when the next question draws.
function tResult(ok){const fb=document.querySelector("#fb .feedback");if(!fb)return;const head=fb.querySelector(":scope > b"),xp=fb.querySelector(":scope > span.small"),img=fb.querySelector(":scope > img");
  const o=document.createElement("div");o.className="fx-res "+(ok?"ok":"no")+(fb.classList.contains("onfire")?" fire":"");o.setAttribute("role","status");
  o.innerHTML=`${img?img.outerHTML:""}<div class="fx-rtxt"><b>${head?esc(head.textContent):""}</b>${xp?`<span>${esc(xp.textContent)}</span>`:""}${ok?"":`<small>Tap to see why ↓</small>`}</div>`;
  o.addEventListener("click",()=>{fb.scrollIntoView({block:"start",behavior:REDUCED?"auto":"smooth"});o.remove();});document.body.appendChild(o);}
function fxAnswer(ok,di,q,wasMastered){if(!TCH)return;document.querySelectorAll(".fx-res").forEach(e=>e.remove());if(tOn("result"))tResult(ok);
  const mine=document.querySelector(".opt.mine"),right=document.querySelector(".opt.right");
  if(!ok&&di>=0&&mine&&tOn("spray")){mine.insertAdjacentHTML("beforeend",`<span class="fx-spray" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="fx-sx" d="M14 18 L86 84"/><path class="fx-sx fx-sx2" d="M84 16 L18 86"/></svg></span>`);tHiss(.28,.07,0);tHiss(.28,.07,.24);}
  if(ok&&right&&tOn("brush"))right.insertAdjacentHTML("beforeend",`<span class="fx-brush" aria-hidden="true"><svg viewBox="0 0 100 60"><path d="M12 32 Q24 40 36 50 Q58 22 92 8"/></svg></span>`);
  if(ok&&TCH.petals&&!REDUCED&&Math.random()<1/TCH.petals)tPetals();
  if(ok&&tOn("stickers")&&!wasMastered&&topicMastered(q.s,q.t))tStickerSlap(TOPIC[keyOf(q)]);}
function tPetals(){for(let i=0;i<14;i++){const p=document.createElement("i");p.className="fx-petal";p.setAttribute("aria-hidden","true");
  p.style.cssText=`--x:${Math.round(Math.random()*100)}vw;--dx:${Math.round(Math.random()*30-10)}vw;--t:${(4+Math.random()*3).toFixed(1)}s;--w:${(Math.random()*1.6).toFixed(2)}s`;
  document.body.appendChild(p);setTimeout(()=>p.remove(),9000);}}
// stickers
function tTheme(t){const n=String(t&&t.id||"").split(".")[0];return /^[1-4]$/.test(n)?`var(--th${n})`:"var(--accent)";}
function tSticker(t,cls){const r=(tHash(t.id)%15)-7,nm=String(t.name||""),short=!cls&&nm.length>34?nm.slice(0,32).replace(/[\s,;:]+\S*$/,"")+"…":nm;return `<span class="fx-stk${cls?" "+cls:""}" style="--c:${tTheme(t)};--r:${r}deg" title="${esc(nm)}"><small>${esc(t.id)}</small>${esc(short)}</span>`;}
function tStickerSlap(t){if(!t)return;const o=document.createElement("div");o.className="fx-slap";o.setAttribute("aria-live","polite");
  o.innerHTML=`<div class="fx-slapin"><b>New sticker!</b>${tSticker(t,"big")}</div>`;document.body.appendChild(o);tone(150,.12,"triangle",.18);setTimeout(()=>o.remove(),2600);}
// the scrapbook (named by Guy 25 Nov 00:36 "Perhaps a scrap book is a better [name for the] stiller book"; Guy 25 Nov 00:29: "an actual sticker book like icon ... 3-dimensional, so it's at an angle"; "it should just be a blank
// page ... perhaps not know how many stickers are attainable ... overlap one another and just be a bit more chaotic"). A spiral notebook drawn
// in code (colours are the skin's, by class); it opens to a blank page where each sticker sits where it fell (placed by its topic, so it
// stays put), turned, overlapping. No slots, no total.
function tNotebook(cls){const fl=(x,y,r)=>`<g class="nb-fl" transform="translate(${x} ${y}) scale(${r})">${[0,72,144,216,288].map(a=>`<ellipse rx="2.3" ry="3.6" cy="-3.2" transform="rotate(${a})"/>`).join("")}<circle class="nb-flc" r="1.3"/></g>`;
  return `<svg class="${cls||"fx-nb"}" viewBox="0 0 124 156" aria-hidden="true"><defs><linearGradient id="nbSky" x1="0" y1="0" x2="0" y2="1"><stop class="nb-s1" offset="0"/><stop class="nb-s2" offset=".62"/><stop class="nb-s3" offset="1"/></linearGradient></defs>
   <rect class="nb-pages" x="14" y="6" width="106" height="146" rx="8"/><rect class="nb-pages2" x="12" y="4" width="106" height="146" rx="8"/>
   <rect class="nb-cover" x="8" y="2" width="106" height="146" rx="8"/><rect x="14" y="8" width="94" height="134" rx="5" fill="url(#nbSky)"/>

   <path class="nb-hill" d="M14 116 Q40 104 62 114 Q86 124 108 110 L108 142 L14 142 Z"/><path class="nb-hill2" d="M14 128 Q50 118 108 130 L108 142 L14 142 Z"/>
   <path class="nb-branch" d="M14 26 Q30 30 40 22 M24 28 Q28 38 22 46 M108 92 Q96 90 90 98"/>
   ${fl(30,24,1.3)}${fl(40,20,1)}${fl(22,40,1.1)}${fl(34,34,.8)}${fl(96,94,1.2)}${fl(102,86,.9)}${fl(88,104,.8)}
   <ellipse class="nb-petal" cx="70" cy="126" rx="2" ry="1.2" transform="rotate(30 70 126)"/><ellipse class="nb-petal" cx="50" cy="132" rx="2" ry="1.2" transform="rotate(-20 50 132)"/>
   <rect class="nb-label" x="84" y="66" width="16" height="40" rx="2"/><text class="nb-labt" x="92" y="78">経</text><text class="nb-labt" x="92" y="90">済</text><text class="nb-labt" x="92" y="102">学</text>
   ${[0,1,2,3,4,5,6,7,8].map(k=>`<path class="nb-ring" d="M4 ${16+k*15.5} q-5 3 0 6 h9"/>`).join("")}</svg>`;}
function tStickerPage(got){const W=got.length,H=Math.max(420,260+W*26);
  const st=got.map(k=>{const t=TOPIC[k],h=tHash(k+"#r"),x=3+tHash("x:"+k+":x")%70,y=Math.round(18+tHash("y:"+k+":y")%(H-130)),r=(h%37)-18,z=1+(tHash("z"+k)%97),sz=82+(tHash(k+"s")%24);

  return `<div class="fx-paper" style="height:${H}px"><i class="fx-tape" aria-hidden="true"></i>${st||`<div class="fx-pencil">your first sticker lands here</div>`}</div>`;}
ACT.stickerBook=()=>{if(document.querySelector(".modal"))return;const got=Object.keys(TOPIC).filter(k=>BANK.some(x=>keyOf(x)===k)&&topicMastered(TOPIC[k].s,TOPIC[k].id));

  document.body.appendChild(o);tone(320,.09,"triangle",.08);o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-m]"))o.remove();});};
// the wall: a graffiti joke and a doodle, both changing each day
const T_DOODLE={cat:"M10 40 Q8 24 14 18 L12 8 L20 15 Q24 13 28 15 L36 8 L34 18 Q40 24 38 40 Z M18 26 h2 M28 26 h2 M22 31 q2 2 4 0",
  cup:"M10 18 h22 v14 q0 8 -11 8 q-11 0 -11 -8 Z M32 22 q8 0 6 7 q-2 4 -6 3 M16 6 q3 4 0 8 M24 4 q3 4 0 8",
  star:"M24 6 L29 19 L43 19 L32 28 L36 42 L24 34 L12 42 L16 28 L5 19 L19 19 Z",

   ?kb=<px> pretends a keyboard of that height is up: phone_audit.py uses it, as no emulator shows a real keyboard. */
const KB_SIM=+(new URLSearchParams(location.search).get("kb")||0);
function askOf(e){let n=e;if(n.parentElement&&n.parentElement.classList.contains("row"))n=n.parentElement;const p=n.previousElementSibling;return p&&p.tagName==="LABEL"?p:null;}
let FULL_H=innerHeight;
function fitPhone(){
  const vv=window.visualViewport,a=document.activeElement;
  const box=!!(a&&a.matches&&a.matches("input:not([type=checkbox]),textarea"));
  const vis=(vv?vv.height:innerHeight)-(box&&KB_SIM?KB_SIM:0);
  if(!box)FULL_H=innerHeight;document.documentElement.style.setProperty("--fullh",FULL_H+"px");const typing=box&&vis<FULL_H-120;
  const was=document.body.classList.contains("typing");
  document.body.classList.toggle("typing",typing);
  document.documentElement.style.setProperty("--vvh",vis+"px");
  if(typing&&!was)(askOf(a)||a).scrollIntoView({block:"start"});
  dbgShow();
}
if(window.visualViewport){visualViewport.addEventListener("resize",fitPhone);visualViewport.addEventListener("scroll",fitPhone);}
document.addEventListener("focusin",fitPhone);document.addEventListener("focusout",()=>setTimeout(fitPhone,50));
/* ?debug=1: the numbers to read off a real phone with the keyboard up (screenshot it and send it back) */
const DBG=/[?&]debug=1(?![0-9])/.test(location.search);
function dbgShow(){
  if(!DBG)return;let d=$("#dbg");if(!d){d=document.createElement("div");d.id="dbg";document.body.appendChild(d);const p=document.createElement("div");p.id="sai";document.body.appendChild(p);}
  const vv=window.visualViewport,cs=getComputedStyle($("#sai"));
  d.textContent=`${APP} v${VERSION} ${PROFILE||""}\ninner ${innerWidth}x${innerHeight}\nvisual ${vv?Math.round(vv.width)+"x"+Math.round(vv.height)+" top "+Math.round(vv.offsetTop):"n/a"}\nsafe ${["Top","Right","Bottom","Left"].map(k=>parseInt(cs["padding"+k])||0).join(" ")}\ndpr ${devicePixelRatio}  typing ${document.body.classList.contains("typing")?"on":"off"}\nstore ${(z=>`${(z.mine/1024).toFixed(1)} KB this app (${z.keys} keys), ${(z.all/1024).toFixed(1)} KB whole site${STORE.failures()?", "+STORE.failures()+" failed saves":""}`)(STORE.sizes())}`;
}
if(DBG){window.addEventListener("resize",dbgShow);setInterval(dbgShow,1000);}

/* ---------- start ---------- */
function route(){
  const m=(location.hash||"").match(new RegExp("^#join-([A-Za-z]{4})(?:-(?:"+COURSES.join("|")+"))?$"));
  if(m&&FEAT("quiz")){history.replaceState(null,"",location.pathname+location.search);ACT.join({code:m[1].toUpperCase()});return;}
  // a direct link to Graph Gym (FNF-120; Guy 25 Nov 08:32 "Can you give me a direct link to something where I can test the graph feature out?")
  if(location.hash==="#graphgym"&&typeof ggOn==="function"&&ggOn()){history.replaceState(null,"",location.pathname+location.search);home();ACT.graphGym();return;}
  const h=location.hash||"",L=h.match(/^#learn\/([a-z_]+)\/([^\/]+)(?:\/(\d+))?$/),Q=h.match(/^#q\/([^\/]+)$/);
  if(L){history.replaceState(null,"",location.pathname+location.search);home();let key=L[1]+"|";try{key+=decodeURIComponent(L[2]);}catch(e){key+=L[2];}
    if(LESSONS[key]){openLesson(key,{});const n=+L[3]||0;if(n>0&&LSN){LSN.i=Math.min(LSN.sc.length-1,n);lessonDraw();}}else toast("That lesson is not in this course.",4200);return;}
  if(Q){history.replaceState(null,"",location.pathname+location.search);home();let id=Q[1];try{id=decodeURIComponent(id);}catch(e){}
    const q=BYID[id],one=q&&inst(q);if(one)startRun({mode:"gym",qs:[one],label:"Shared question",clock:false,key:"shared"});else toast("That question is not in this course.",4200);return;}
  home();
}
let READY=false;   // a join link opened while the questions are still loading is handled once they are in
window.addEventListener("hashchange",()=>{if(READY)route();});
guideSplash();
loadAll().catch(e=>console.error(e)).then(()=>{READY=true;route();});
</script>
